  <script>
    // Set the theme before first paint so dark-mode visitors get no white flash.
    (function () {
      try {
        var t = localStorage.getItem('kvot-theme');
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
        // the table panels' width, for the stand-in shown while the scripts load
        var w = localStorage.getItem('smui.sideW');
        if (w) document.documentElement.style.setProperty('--sm-boot-side-w', w);
      } catch (e) { /* storage unavailable — site.js will apply the default */ }
    })();
  </script>

  <!--
    The page's scripts, in the order they need each other; all deferred
    (with JSZip in the head), so they download together instead of one
    after another, and run in this order once the page is parsed. Plotly
    (in the head) is async: the workbench starts without it, and a graph
    that was to be drawn before it came is drawn when it does:
      kvot-info     the (i) buttons and their panel (shared with the other tools)
      xlsxwrite     the Excel writer (needs JSZip, loaded above)
      smui-util     events, number formatting, DOM building, random numbers
      smui-touchdrag  drag and drop by touch, for phones
      smui-table    the data table: columns, modeling types, row states
      smui-io       CSV, Excel and JSON in and out; the simulated examples
      smui-engine   the Python engine (smui-worker.mjs, a module worker)
      smui-ui       menus, dialogs, forms
      smui-grid     the data grid
      smui-report   reports: outline boxes, report tables, linked graphs
      smui-launch   launch dialogs
      smui-panels   the Table, Columns and Rows panels
      smui-app      the page: menu bar, tabs, the platform registry
      smui-help     the Help tab
      smui-formula  the formula language of formula columns
      smui-p-*      the platforms, one file (and one stylesheet) per menu area
  -->
