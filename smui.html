      smui-table    the data table: columns, modeling types, row states

      smui-engine   the Python engine (smui-worker.mjs, a module worker)

      smui-report   reports: outline boxes, report tables, linked graphs
      smui-launch   launch dialogs
      smui-panels   the Table, Columns and Rows panels
      smui-app      the page: menu bar, tabs, the platform registry
