<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <link href="https://unpkg.com/leaflet@1.9.2/dist/leaflet.css" rel="stylesheet">
  <script src="https://unpkg.com/leaflet@1.9.2/dist/leaflet.js"></script>
  <link rel="stylesheet" href="./resources/css/kvot.css">
  <link rel="icon" type="image/x-icon" href="./resources/images/favicon.ico">
  <title>SKB Reference Checker</title>
  <style>
    /* Layout */
    header { position:fixed;top:0;left:0;right:0;z-index:20;background:var(--footer-bg);box-shadow:0 2px 8px rgba(0,0,0,.12); }
    body   { overflow-x:hidden; }
    .content { padding-top:56px;padding-bottom:48px;min-height:calc(100vh - 104px); }
    #app { width:100%;max-width:980px;margin:0 auto;padding:28px 28px 56px;box-sizing:border-box; }

    /* Drop zone */
    #dropzone {
      border:2px dashed var(--border-color);border-radius:14px;
      padding:48px 24px;text-align:center;cursor:pointer;
      background:var(--bg-secondary);transition:border-color .15s,background .15s;
      margin-bottom:24px;
    }
    #dropzone.drag-over { border-color:var(--color-kvot-bright);background:color-mix(in srgb,var(--color-kvot-bright) 6%,var(--bg-secondary)); }
    #dropzone input[type=file] { display:none; }
    #dropzone .dz-icon { font-size:2.4rem;margin-bottom:10px;opacity:.6; }
    #dropzone .dz-label { font-size:1rem;font-weight:600;color:var(--text-primary);margin-bottom:4px; }
    #dropzone .dz-sub { font-size:.84rem;color:var(--text-muted); }
    #dropzone .dz-btn {
      display:inline-block;margin-top:14px;padding:8px 20px;border-radius:20px;
      background:var(--color-kvot-bright);color:#fff;font-size:.88rem;font-weight:600;
      border:none;cursor:pointer;transition:opacity .15s;
    }
    #dropzone .dz-btn:hover { opacity:.88; }

    /* Progress / status */
    #status-bar { display:none;align-items:center;gap:10px;padding:12px 16px;
      background:var(--bg-secondary);border:1px solid var(--border-color);border-radius:10px;
      margin-bottom:20px;font-size:.88rem;color:var(--text-secondary); }
    #status-bar.show { display:flex; }
    .spinner { width:16px;height:16px;border:2px solid var(--border-color);
      border-top-color:var(--color-kvot-bright);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0; }
    @keyframes spin { to { transform:rotate(360deg); } }

    /* Summary cards */
    #summary-cards { display:none;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px; }
    #summary-cards.show { display:grid; }
    .sum-card { background:var(--bg-secondary);border:1px solid var(--border-color);border-radius:10px;
      padding:14px 16px;text-align:center; }
    .sum-card.warn  { border-color:var(--color-kvot-accent);background:color-mix(in srgb,var(--color-kvot-accent) 8%,var(--bg-secondary)); }
    .sum-card.ok    { border-color:#5cb85c;background:color-mix(in srgb,#5cb85c 8%,var(--bg-secondary)); }
    .sum-label { font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text-muted);margin-bottom:4px; }
    .sum-value { font-size:1.5rem;font-weight:700;color:var(--text-primary);font-family:'SF Mono',Menlo,monospace; }
    .sum-card.warn .sum-value { color:var(--color-kvot-accent); }
    .sum-card.ok   .sum-value { color:#5cb85c; }

    /* Result sections (collapsible) */
    .result-section { margin-bottom:16px;border-radius:10px; }
    .result-section summary {
      cursor:pointer;padding:11px 16px;background:var(--bg-secondary);border:1px solid var(--border-color);
      border-radius:10px;font-weight:600;font-size:.88rem;color:var(--text-primary);
      display:flex;align-items:center;gap:8px;list-style:none;
      transition:background .12s,border-color .12s;user-select:none;-webkit-user-select:none;
    }
    .result-section summary::-webkit-details-marker { display:none; }
    .result-section summary::before { content:'▸';font-size:.72em;color:var(--text-muted);transition:transform .2s;flex-shrink:0; }
    .result-section[open]>summary::before { transform:rotate(90deg); }
    .result-section summary:hover { background:var(--bg-surface);border-color:var(--color-kvot-bright); }
    .result-section[open]>summary { border-radius:10px 10px 0 0;border-bottom-color:transparent; }
    .section-badge {
      margin-left:auto;font-size:.74rem;font-weight:700;padding:2px 10px;
      border-radius:12px;background:var(--border-color);color:var(--text-muted);
    }
    .section-badge.error  { background:color-mix(in srgb,var(--color-kvot-accent) 18%,var(--bg-secondary));color:var(--color-kvot-accent); }
    .section-badge.warn   { background:color-mix(in srgb,#f0ad4e 18%,var(--bg-secondary));color:#c87d0a; }
    .section-badge.good   { background:color-mix(in srgb,#5cb85c 18%,var(--bg-secondary));color:#357a35; }
    [data-theme="dark"] .section-badge.warn  { color:#f0c060; }
    [data-theme="dark"] .section-badge.good  { color:#6dd36d; }
    .section-body { padding:16px 18px;background:var(--bg-secondary);border:1px solid var(--border-color);border-top:none;border-radius:0 0 10px 10px; }
    .section-body a:hover {
      text-decoration: underline;
    }

    /* Reference table */
    .ref-table { width:100%;border-collapse:collapse;font-size:.86rem; }
    .ref-table th { text-align:left;padding:8px 10px;font-size:.72rem;font-weight:700;text-transform:uppercase;
      letter-spacing:.06em;color:var(--text-muted);border-bottom:1px solid var(--border-color);white-space:nowrap; }
    .ref-table td { padding:8px 10px;vertical-align:top;border-bottom:1px solid var(--border-color);line-height:1.4; }
    .ref-table tr:last-child td { border-bottom:none; }
    .ref-table tr:hover td { background:var(--bg-surface); }
    .ref-key { font-family:'SF Mono',Menlo,monospace;font-size:.83rem;color:var(--color-kvot-accent);white-space:nowrap; }
    .ref-text { color:var(--text-secondary);max-width:420px; }
    .ref-text em { font-style:normal;background:color-mix(in srgb,var(--color-kvot-bright) 18%,transparent);
      border-radius:3px;padding:0 2px; }
    .cite-count { font-weight:700;color:var(--text-primary); }
    .cite-pages { font-size:.78rem;color:var(--text-muted);margin-top:2px; }
    .issue-list { margin:0;padding:0 0 0 16px;color:var(--color-kvot-accent);font-size:.84rem; }
    .issue-list li { margin-bottom:2px; }
    .warn-row td { background:color-mix(in srgb,#f0ad4e 5%,var(--bg-secondary)); }
    .error-row td { background:color-mix(in srgb,var(--color-kvot-accent) 5%,var(--bg-secondary)); }

    /* Orphan / missing lists */
    .tag-list { display:flex;flex-wrap:wrap;gap:6px;margin-top:0; }
    .tag { display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:14px;
      font-size:.82rem;font-weight:500;border:1px solid var(--border-color);background:var(--bg-secondary); }
    .tag.error-tag { border-color:var(--color-kvot-accent);color:var(--color-kvot-accent);
      background:color-mix(in srgb,var(--color-kvot-accent) 8%,var(--bg-secondary)); }
    .tag.warn-tag  { border-color:#f0ad4e;color:#c87d0a;
      background:color-mix(in srgb,#f0ad4e 8%,var(--bg-secondary)); }
    [data-theme="dark"] .tag.warn-tag { color:#f0c060; }
    .tag code { font-family:'SF Mono',Menlo,monospace;font-size:.82rem; }

    /* Document info bar */
    #doc-info { display:none;padding:10px 16px;background:var(--bg-secondary);
      border:1px solid var(--border-color);border-radius:8px;margin-bottom:20px;
      font-size:.84rem;color:var(--text-secondary);line-height:1.6; }
    #doc-info.show { display:block; }
    #doc-info strong { color:var(--text-primary); }

    /* Reset button */
    #reset-btn { display:none;float:right;margin-top:-4px;padding:5px 14px;
      background:var(--bg-secondary);border:1px solid var(--border-color);
      border-radius:8px;font-size:.82rem;color:var(--text-secondary);cursor:pointer; }
    #reset-btn:hover { border-color:var(--color-kvot-bright);color:var(--text-primary); }
    #reset-btn.show { display:inline-block; }

    /* Empty state */
    .empty-notice { color:var(--text-muted);font-size:.88rem;font-style:italic;padding:6px 0; }

    /* Responsive */
    @media (max-width:700px) { #summary-cards{grid-template-columns:1fr 1fr} }
    @media (max-width:480px) { #app{padding:14px 12px 32px} #summary-cards{grid-template-columns:1fr 1fr;gap:8px} }
  </style>
</head>
<body>
  <header></header>
  <div class="content">
    <div id="app">

      <button id="reset-btn" title="Analyse another document">↩ New document</button>

      <!-- Drop zone -->
      <div id="dropzone" role="region" aria-label="Upload Word document">
        <input type="file" id="file-input" accept=".docx">
        <div class="dz-icon">📄</div>
        <div class="dz-label">Drop a Word file here</div>
        <div class="dz-sub">or click to browse &mdash; .docx only</div>
        <button class="dz-btn" type="button" onclick="document.getElementById('file-input').click()">Choose file</button>
      </div>

      <!-- Status bar -->
      <div id="status-bar"><div class="spinner"></div><span id="status-msg">Analysing&hellip;</span></div>

      <!-- Document info -->
      <div id="doc-info"></div>

      <!-- Summary cards -->
      <div id="summary-cards">
        <div class="sum-card" id="card-total">
          <div class="sum-label">References in list</div>
          <div class="sum-value" id="cnt-total">—</div>
        </div>
        <div class="sum-card" id="card-cited">
          <div class="sum-label">Cited in text</div>
          <div class="sum-value" id="cnt-cited">—</div>
        </div>
        <div class="sum-card" id="card-orphan">
          <div class="sum-label">Orphan in-text</div>
          <div class="sum-value" id="cnt-orphan">—</div>
        </div>
        <div class="sum-card" id="card-issues">
          <div class="sum-label">Format issues</div>
          <div class="sum-value" id="cnt-issues">—</div>
        </div>
      </div>

      <!-- Results -->
      <div id="results"></div>

    </div>
    <div id="map"></div>
  </div>
  <footer></footer>

  <script src="./resources/js/site.js"></script>
  <script>
    KVOT.renderHeader('SKB Reference Checker');
    KVOT.renderNav('skbref.html');
    KVOT.renderFooter();
    KVOT.initMap('map');
  </script>

  <!-- JSZip for unzipping .docx (docx = zip of XML) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <script>
  /* ====================================================================
     SKB Reference Checker — core logic
     ====================================================================

     SKB reference style (from "Angivande av referenser i publika rapporter"
     and "Skrivhandboken"):

     IN-TEXT CITATIONS
     -----------------
     • Author-year style: (Author 2024)  (Author et al. 2024)
       Author and Author (2024)  (Author 2024, Author2 2023)
     • SKB report shorthand: SKB 2011a  SKB (2011b)  SKB TR-10-48

     REFERENCE LIST
     --------------
     Detected by heading matching "References", "Litteratur", "Referenser",
     "Referenslista", "Bibliography" or similar (case-insensitive).

     SKB FORMAT RULES CHECKED
     ------------------------
     1. Report number present for SKB reports (TR-XX-YY, R-XX-YY, P-XX-YY,
        IPR-XX-YY, RD&D-XX, SKB-R-XX-YY, STUDSVIK/NW-XX-YY, etc.)
     2. Year present and in plausible range (1900–2099)
     3. Author(s) present — not just a URL
     4. For numbered lists: entry starts with digit (or [digit])
     5. Title should be present (rough check: entry long enough)
     6. Trailing period or expected end punctuation
  ==================================================================== */

  // ── DOM refs ──────────────────────────────────────────────────────────────
  const dropzone   = document.getElementById('dropzone');
  const fileInput  = document.getElementById('file-input');
  const statusBar  = document.getElementById('status-bar');
  const statusMsg  = document.getElementById('status-msg');
  const docInfo    = document.getElementById('doc-info');
  const summCards  = document.getElementById('summary-cards');
  const results    = document.getElementById('results');
  const resetBtn   = document.getElementById('reset-btn');

/*
  ===============================================================
  Zotero Web API configuration
  ===============================================================

  The library is public, so no API key is needed.
*/
const ZOTERO_CONFIG = {
  groupId: '6640399',
  apiVersion: '3',
  minimumScore: 55,
  maximumCandidates: 3,

  searchResultLimit: 15,
  searchTimeoutMilliseconds: 10000,

  maximumOrphanLookups: 30,
  maximumUncitedLookups: 30
};

  // ── Drag-and-drop wiring ──────────────────────────────────────────────────
  dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag-over'); });
  dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag-over'));
  dropzone.addEventListener('drop', e => {
    e.preventDefault(); dropzone.classList.remove('drag-over');
    const f = e.dataTransfer.files[0];
    if (f) handleFile(f);
  });
  dropzone.addEventListener('click', e => {
    if (e.target.closest('.dz-btn') || e.target === fileInput) return;
    fileInput.click();
  });
  fileInput.addEventListener('change', () => { if (fileInput.files[0]) handleFile(fileInput.files[0]); });
  resetBtn.addEventListener('click', resetUI);

  // ── Reset ─────────────────────────────────────────────────────────────────
  function resetUI() {
    dropzone.style.display = '';
    statusBar.classList.remove('show');
    docInfo.classList.remove('show');
    summCards.classList.remove('show');
    results.innerHTML = '';
    resetBtn.classList.remove('show');
    fileInput.value = '';
  }

  // ── Status helpers ────────────────────────────────────────────────────────
  function showStatus(msg) {
    statusMsg.textContent = msg;
    statusBar.classList.add('show');
  }
  function hideStatus() { statusBar.classList.remove('show'); }

  // ── Main entry ────────────────────────────────────────────────────────────
  async function handleFile(file) {
    if (!file.name.endsWith('.docx')) {
      alert('Please upload a .docx file.');
      return;
    }
    dropzone.style.display = 'none';
    showStatus('Reading file…');
    try {
      const buf = await file.arrayBuffer();
      showStatus('Unzipping .docx…');
      const zip = await JSZip.loadAsync(buf);

      // Extract main document XML
      const docXml = await zip.file('word/document.xml')?.async('string');
      if (!docXml) throw new Error('word/document.xml not found — is this a valid .docx?');

      // Optional: extract numbering for numbered lists
      const numXml = await zip.file('word/numbering.xml')?.async('string') || '';

      showStatus('Parsing document…');
      await yieldToBrowser();

      const { paragraphs, fullText, isSwedish } = parseDocXml(docXml);

      showStatus('Finding reference list…');
      await yieldToBrowser();
      const { refListParagraphs, bodyParagraphs, refListStart } = splitAtRefList(paragraphs);

      showStatus('Extracting references…');
      await yieldToBrowser();
      const refEntries = extractRefEntries(refListParagraphs);

      showStatus('Finding in-text citations…');
      await yieldToBrowser();
      const inTextCites = findInTextCites(
        bodyParagraphs,
        refEntries
      );

      showStatus('Cross-referencing…');
await yieldToBrowser();

const report = crossReference(
  refEntries,
  inTextCites,
  bodyParagraphs
);

/*
  Search the public Zotero group library for probable matches to:

    - orphan in-text citations;
    - uncited document references.

  Zotero failures do not stop the normal document analysis.
*/
let zoteroResult = {
  available: false,
  error: null,
  itemCount: 0,
  orphanMatches: [],
  uncitedMatches: []
};

showStatus(
  `Preparing Zotero searches for ` +
  `${report.orphanCites.length} orphan citations and ` +
  `${report.uncitedRefs.length} uncited references…`
);

await yieldToBrowser();

try {
  /*
    Do not contact Zotero when there is nothing to investigate.
  */
  if (
    report.orphanCites.length === 0 &&
    report.uncitedRefs.length === 0
  ) {
    zoteroResult = {
      available: true,
      error: null,
      itemCount: 0,
      orphanMatches: [],
      uncitedMatches: [],
      skippedOrphanCount: 0,
      skippedUncitedCount: 0
    };
  } else {
    /*
      Apply an overall limit so Zotero can never prevent the document
      analysis from completing indefinitely.
    */
    zoteroResult = await withTimeout(
      analyseAgainstZotero(
        report.orphanCites,
        report.uncitedRefs
      ),
      60000,
      'The complete Zotero analysis exceeded 60 seconds.'
    );
  }
} catch (zoteroError) {
  console.warn(
    'Zotero lookup could not be completed:',
    zoteroError
  );

  zoteroResult = {
    available: false,
    error:
      zoteroError instanceof Error
        ? zoteroError.message
        : String(zoteroError),
    itemCount: 0,
    orphanMatches: [],
    uncitedMatches: [],
    skippedOrphanCount: 0,
    skippedUncitedCount: 0
  };
}

showStatus('Checking SKB format rules…');
      await yieldToBrowser();
      const formatIssues = checkSkbFormat(refEntries);

      // Inject duplicate-key errors into format issues so they surface in that panel
      for (const dupes of report.duplicateKeys) {
        for (const e of dupes) {
          formatIssues.push({ key: e.key, issue: `Duplicate key in reference list — ${dupes.length} entries share the same key`, severity: 'error' });
        }
      }

      hideStatus();
      renderResults(file.name, refEntries, inTextCites, report, formatIssues, paragraphs.length, refListStart, isSwedish, zoteroResult);
    } catch (err) {
      hideStatus();
      results.innerHTML = `<div style="color:var(--color-kvot-accent);padding:16px;background:var(--bg-secondary);border:1px solid;border-color:var(--color-kvot-accent);border-radius:8px;">
        <strong>Error:</strong> ${escHtml(err.message)}</div>`;
      resetBtn.classList.add('show');
    }
  }

  function yieldToBrowser() { return new Promise(r => setTimeout(r, 0)); }

function withTimeout(
  promise,
  timeoutMilliseconds,
  message
) {
  let timeoutId;

  const timeoutPromise = new Promise(
    (_, reject) => {
      timeoutId = setTimeout(() => {
        reject(new Error(message));
      }, timeoutMilliseconds);
    }
  );

  return Promise.race([
    promise,
    timeoutPromise
  ]).finally(() => {
    clearTimeout(timeoutId);
  });
}

  // ── DOCX XML parser ───────────────────────────────────────────────────────
  function parseDocXml(xml) {
    const parser = new DOMParser();
    const doc = parser.parseFromString(xml, 'application/xml');
    const NS = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main';

    // Detect document language from w:lang attributes on runs
    let isSwedish = false;
    const langNodes = doc.getElementsByTagNameNS(NS, 'lang');
    for (let i = 0; i < langNodes.length && i < 40; i++) {
      const val = langNodes[i].getAttribute('w:val') || '';
      if (/^sv/i.test(val)) { isSwedish = true; break; }
    }

    const paragraphNodes = doc.getElementsByTagNameNS(NS, 'p');
    const paragraphs = [];

    for (let i = 0; i < paragraphNodes.length; i++) {
      const pNode = paragraphNodes[i];
      const text = extractTextFromParagraph(pNode, NS);
      // Get style name for heading detection
      const pPr = pNode.getElementsByTagNameNS(NS, 'pPr')[0];
      let style = '';
      if (pPr) {
        const pStyle = pPr.getElementsByTagNameNS(NS, 'pStyle')[0];
        if (pStyle) style = (pStyle.getAttribute('w:val') || '').toLowerCase();
      }
      // Get numbering level (for numbered list entries)
      let numId = '', ilvl = '';
      if (pPr) {
        const numPr = pPr.getElementsByTagNameNS(NS, 'numPr')[0];
        if (numPr) {
          const ni = numPr.getElementsByTagNameNS(NS, 'numId')[0];
          const il = numPr.getElementsByTagNameNS(NS, 'ilvl')[0];
          numId = ni ? (ni.getAttribute('w:val') || '') : '';
          ilvl  = il ? (il.getAttribute('w:val') || '') : '';
        }
      }
      paragraphs.push({ text: text.trim(), style, numId, ilvl, index: i });
    }

    // Second pass: tag each paragraph with the nearest enclosing heading text
    let currentSection = '';
    for (const p of paragraphs) {
      const lvl = headingLevel(p.style);
      if (lvl > 0 && p.text.trim()) currentSection = p.text.trim();
      p.section = currentSection;
    }

    const fullText = paragraphs.map(p => p.text).join('\n');
    return { paragraphs, fullText, isSwedish };
  }

  function extractTextFromParagraph(pNode, NS) {
    let text = '';
    // Track field nesting; skip result text of numbering/formatting fields (SEQ, PAGE, etc.)
    const fieldStack = []; // {skip: bool, inResult: bool}

    function walk(node) {
      for (let child = node.firstChild; child; child = child.nextSibling) {
        if (child.nodeType !== 1) continue;
        if (child.namespaceURI === NS) {
          switch (child.localName) {
            case 'fldChar': {
              const type = child.getAttribute('w:fldCharType');
              if      (type === 'begin')    fieldStack.push({ skip: false, inResult: false });
              else if (type === 'separate' && fieldStack.length) fieldStack[fieldStack.length-1].inResult = true;
              else if (type === 'end'      && fieldStack.length) fieldStack.pop();
              break;
            }
            case 'instrText':
              if (fieldStack.length) {
                const instr = (child.textContent || '').trim();
                if (/^(SEQ|CAPTION|PAGE|NUMPAGES|REF\b|PAGEREF|STYLEREF|TOC|TC\b|XE\b|AUTONUMLGL|AUTONUM|MERGEFIELD)\b/i.test(instr))
                  fieldStack[fieldStack.length-1].skip = true;
              }
              break;
            case 't':
              if (!fieldStack.some(f => f.inResult && f.skip))
                text += child.textContent || '';
              break;
            default:
              walk(child);
          }
        } else {
          walk(child);
        }
      }
    }

    walk(pNode);
    return text;
  }

  // ── Split document at reference list heading ──────────────────────────────
  const REF_HEADING_RE = /^\s*(?:\d[\d.]*\s+)?(?:references?|referenser|referenslista|litteratur|bibliography)\s*$/i;

  function splitAtRefList(paragraphs) {
  let refListStart = -1;

  /*
    Find the reference-list heading.
  */
  for (let i = 0; i < paragraphs.length; i++) {
    const paragraph = paragraphs[i];

    const isHeading =
      paragraph.style.startsWith('heading') ||
      paragraph.style.startsWith('rubrik') ||
      paragraph.style.includes('heading') ||
      paragraph.style.startsWith('appendixrubrik') ||
      paragraph.style === 'title';

    const textMatch = REF_HEADING_RE.test(
      paragraph.text
    );

    if (isHeading && textMatch) {
      /*
        Verify that some meaningful text follows the heading.
      */
      const preview = paragraphs
        .slice(i + 1, i + 6)
        .map(item => item.text)
        .join(' ');

      if (preview.length > 10) {
        refListStart = i;
        break;
      }
    }
  }

  /*
    Fallback for numbered reference lists when no recognised reference
    heading was found.
  */
  if (refListStart === -1) {
    for (
      let i = Math.floor(paragraphs.length * 0.6);
      i < paragraphs.length;
      i++
    ) {

        previousAuthor &&
        previousAuthor.toUpperCase() !== 'SKB'
      ) {
        const year = inheritedYearMatch[1];

        out.push({
          key: `${previousAuthor} ${year}`,
          raw: part,
          paraIndex,
          section,
          paraText,
          type: 'author-year',
          author: previousAuthor,
          year
        });
      }
    }
  }

  /*
    ===============================================================
    2. Narrative citations
    ===============================================================

    Handles:

      Auqué et al. (2013)
      Auqué et al. (2013, Tables 5-1–5-3)
      Öhman et al. (2014)
      van Loon et al. (1997)
      Avila and Bergström (2006)
      SSM (2017)
  */
  const inlineCitationRe = new RegExp(
    `(?:^|[^A-Za-zÀ-ÖØ-Þà-öø-ÿ])` +
    `(${citationAuthorPattern})` +
    `\\s+\\(` +
    `(${publicationYearPattern})` +
    `(?:\\s*,\\s*[^()]*)?` +
    `\\)`,
    'g'
  );

  inlineCitationRe.lastIndex = 0;

  while (
    (match = inlineCitationRe.exec(text)) !== null
  ) {
    const author = normaliseCitationAuthor(match[1]);
    const year = match[2];

    // SKB (2019) is handled by findSkbCitations().
    if (author.toUpperCase() === 'SKB') {
      continue;
    }

    out.push({
      key: `${author} ${year}`,
      raw: `${author} (${year})`,
      paraIndex,
      section,
      paraText,
      type: 'author-year',
      author,
      year
    });
  }
}

/*
  Normalise minor variations in author citation text.

  Examples:

    "Walke et al"  -> "Walke et al."
    "Walke et al." -> "Walke et al."
    "Smith   and   Jones" -> "Smith and Jones"
*/
function normaliseCitationAuthor(author) {
  return String(author)
    .replace(/\s+/g, ' ')
    .replace(/\bet\s+al\.?$/i, 'et al.')
    .replace(/\bm\.fl\.?$/i, 'm.fl.')
    .trim();
}

  function findSkbCitations(
  text,
  paraIndex,
  section,
  paraText,
  out
) {
  // Normalise Word/PDF dash characters before matching.
  const normalizedText = normaliseDashes(text);

  const re =
    /\bSKB\s+(?:\(((?:1[89]\d{2}|20\d{2})[a-z]?(?:[,\s]+(?:1[89]\d{2}|20\d{2})[a-z]?)*)\)|((?:1[89]\d{2}|20\d{2})[a-z]?)(?!\s*\w)|((?:TR|R|P|IPR|RD|SR|TM|U|F)-\d{2,}-\d+))/gi;

  let match;
  re.lastIndex = 0;

  while ((match = re.exec(normalizedText)) !== null) {
    // Parenthesised SKB year or years:
    // SKB (2019), SKB (2019a), SKB (2019a, 2020)
    if (match[1]) {
      const years = match[1].split(/\s*,\s*/);

      for (const value of years) {
        const year = value.trim();

        if (/^(?:1[89]\d{2}|20\d{2})[a-z]?$/.test(year)) {
          out.push({
            key: `SKB ${year}`,
            raw: match[0],
            paraIndex,
            section,
            paraText,
            type: 'skb-year'
          });
        }
      }
    } else if (match[2]) {
      // Non-parenthesised ye*r: SKB 2019
      out.push({
      key: `SKB ${match[2]}`,
      raw: match[0],
      paraIndex,
      section,
      paraText,
      type: 'skb-year'
      });
    } else if (match[3]) {
      // SKB report identifier: SKB TR-19-01
      out.push({
        key: `SKB ${match[3].toUpperCase()}`,
        raw: match[0],
        paraIndex,
        section,
        paraText,
        type: 'skb-report'
      });
    }
  }
}

  // ── Cross-reference citations ↔ list ──────────────────────────────────────
  function crossReference(refEntries, inTextCites, bodyParas) {
    // refByKey maps normalised key → array of entries (supports duplicate keys)
    const refByKey = new Map();
    const refByAlias = new Map();
    const refByNum = new Map();

    for (const e of refEntries) {
      const nk = normaliseKey(e.key);
      if (!refByKey.has(nk)) refByKey.set(nk, []);
      refByKey.get(nk).push(e);
      for (const alias of (e.aliases || [])) {
        const na = normaliseKey(alias);
        if (!refByAlias.has(na)) refByAlias.set(na, []);
        refByAlias.get(na).push(e);
      }
      if (e.num !== null) refByNum.set(e.num, e);
      e.cites = [];
    }

    // Detect keys that appear more than once in the list
    const duplicateKeys = [];
    for (const [, entries] of refByKey) {
      if (entries.length > 1) duplicateKeys.push(entries);
    }

    const orphanCites = [];

    for (const c of inTextCites) {
      let matched = false;
      if (c.type === 'numbered' && refByNum.has(c.num)) {
        refByNum.get(c.num).cites.push(c);
        matched = true;
      } else {
        const nk = normaliseKey(c.key);
        if (refByKey.has(nk)) {
          // Assign to ALL entries sharing this key so none appear "never cited"
          for (const entry of refByKey.get(nk)) entry.cites.push(c);
          matched = true;
        } else if (refByAlias.has(nk)) {
          // Match on alternate reference keys, e.g. SKB R-13-27 → author-year entry
          for (const entry of refByAlias.get(nk)) entry.cites.push(c);
          matched = true;
        } else {
          for (const [rk, entries] of refByKey) {
            if (fuzzyMatch(nk, rk)) {
              for (const entry of entries) entry.cites.push(c);
              matched = true; break;
            }
          }
        }
      }
      if (!matched) orphanCites.push(c);
    }

    const uncitedRefs = refEntries.filter(e => e.cites.length === 0);
    return { orphanCites, uncitedRefs, duplicateKeys };
  }

  
function normaliseKey(key) {
  return normaliseDashes(key)
    .normalize('NFC')
    .toLowerCase()
    .replace(/et\s*al\.?/g, 'etal')
    .replace(/\s*-\s*/g, '-')
    .replace(/[\s.,;:!?'"()\[\]{}]/g, '');
}

  function fuzzyMatch(a, b) {
    if (a.length < 4 || b.length < 4) return false;
    // Check if one contains the other or 80% overlap
    if (b.includes(a) || a.includes(b)) return true;
    // Simple bigram similarity
    const bg = s => { const r = new Set(); for (let i = 0; i < s.length - 1; i++) r.add(s.slice(i, i+2)); return r; };
    const ba = bg(a), bb = bg(b);
    let common = 0;
    for (const bi of ba) if (bb.has(bi)) common++;
    return common / Math.max(ba.size, bb.size) > 0.7;
  }

  // ── SKB format rule checker ───────────────────────────────────────────────
  /*
    Rules derived from SKB writing guidelines:
    1. Year must be present (4 digits, 1900-2099, optionally followed by a/b/c)
    2. SKB report number format: TR-XX-XX  R-XX-XX  P-XX-XX  IPR-XX-XX
       TR = Technical Report, R = Report, P = Project Report, IPR = Interim…
    3. Authors: at least one name (not just URL, not just organisation)
    4. Entry should have title (quoted or in italics — hard to detect from plain text,
       so we check minimum length and structure)
    5. For SKB internal refs: publisher "SKB" or "Swedish Nuclear Fuel and Waste Management Co"
    6. No trailing comma / incorrect punctuation at end
    7. URL-only references should also have access date
    8. For journal articles: volume/issue pattern present
    9. Numbered entries should be sequential
  */
  const SKB_REPORT_RE =
  /\b(?:SKB\s+)?(?:TR|R|P|IPR|RD|SR|TM|U|F)[-\u2010\u2011\u2012\u2013\u2014\u2212]\d{2,}[-\u2010\u2011\u2012\u2013\u2014\u2212]\d+\b/i;
  const YEAR_IN_TEXT_RE = /\b(1[89][0-9]{2}|20[0-9]{2})[a-z]?\b/;
  const SEQUENTIAL_GAP_THRESHOLD = 5;

  function checkSkbFormat(refEntries) {
    const issues = []; // { key, issue, severity }

    // Check sequential numbering
    const numbered = refEntries.filter(e => e.num !== null).sort((a, b) => a.num - b.num);
    for (let i = 0; i < numbered.length - 1; i++) {
      const gap = numbered[i + 1].num - numbered[i].num;
      if (gap > 1) issues.push({ key: numbered[i + 1].key, issue: `Numbering gap: expected [${numbered[i].num + 1}] before [${numbered[i + 1].num}]`, severity: 'warn' });
    }

    for (const e of refEntries) {
      const text = e.body;
      const entryIssues = [];

      // Rule 1: Year present
      if (!YEAR_IN_TEXT_RE.test(text)) {
        entryIssues.push({ issue: 'No year detected in reference', severity: 'warn' });
      }

      // Rule 2: SKB report number format (only if "SKB" appears)
      if (/\bskb\b/i.test(text) && !SKB_REPORT_RE.test(text)) {
        // Could be SKB year-only citation — only warn if it looks like a report
        if (/(report|rapport|technical|intern)\b/i.test(text)) {
          entryIssues.push({ issue: 'SKB report reference lacks report number (e.g. TR-XX-XX)', severity: 'error' });
        }
      }

      // Rule 3: Author present — not just URL
      const isUrlOnly = /^https?:\/\//.test(text.trim());
      if (isUrlOnly) {
        entryIssues.push({ issue: 'URL-only reference; add author, title, and access date', severity: 'error' });
      }
      // Check for at least something that looks like an author (capitalized last name before year)
      const hasAuthorLike = /[A-ZÅÄÖ][a-zåäö]+/.test(text.split(YEAR_IN_TEXT_RE)[0] || text);
      if (
        !hasAuthorLike &&
        !isUrlOnly &&
          e.type !== 'abbreviated-name'
        ) {
        entryIssues.push({
          issue: 'Author name not clearly identifiable',
          severity: 'warn'
        });
      }

      // Rule 4: Entry length (too short to have all needed info)
      if (text.length < 30) {
        entryIssues.push({ issue: 'Entry seems too short — likely incomplete', severity: 'warn' });
      }

      // Rule 5: URL references should have access date
      if (/https?:\/\//.test(text) && !/(?:accessed|hämtad|hämtat|visited|retrieved|besökt)\s/i.test(text)) {
        entryIssues.push({ issue: 'URL present but no access date (e.g. "Accessed 2024-01-01")', severity: 'warn' });
      }

      // Rule 6: Trailing punctuation — should end with period
      const last = text.trim().slice(-1);
      if (text.length > 20 && last !== '.' && last !== ')') {
        entryIssues.push({ issue: `Reference does not end with a period (ends with "${last}")`, severity: 'info' });
      }

      // Rule 7: For what appears to be a journal — check for volume/issue or doi
      const looksLikeJournal = /\bvol\.?\s*\d|pp?\.?\s*\d|doi[:.\s]/i.test(text);
      // (no action needed here, just detection for completeness)

      // Rule 8: No CAPS-only author abbreviations where full name expected
      if (
        e.type !== 'abbreviated-name' &&
          /^\[?\d+\]?\s+[A-ZÅÄÖ]{3,}[,\s]/.test(e.raw)
      ) {
        entryIssues.push({
          issue: 'Author appears to be in ALL CAPS — use "Lastname, Firstname" format',
          severity: 'info'
       });
      }

      if (entryIssues.length > 0) {
        for (const ei of entryIssues) issues.push({ key: e.key, ...ei });
      }
    }

    return issues;
  }

/*
  Cache Zotero searches for this browser session.

  If several citations produce the same query, Zotero is only called
  once.
*/
const zoteroSearchCache = new Map();
async function searchZoteroItems(
  query,
  {
    qmode = 'titleCreatorYear',
    limit = 25,
    timeoutMilliseconds = 15000
  } = {}
) {
  const cleanedQuery = String(query || '')
    .replace(/\s+/g, ' ')
    .trim();

  if (!cleanedQuery) {
    return [];
  }

  const cacheKey =
    `${qmode}||${cleanedQuery.toLowerCase()}`;

  if (zoteroSearchCache.has(cacheKey)) {
    return zoteroSearchCache.get(cacheKey);
  }

  const groupId = String(
    ZOTERO_CONFIG.groupId || ''
  ).trim();

  if (!/^\d+$/.test(groupId)) {
    throw new Error(
      'Zotero group ID is missing or invalid.'
    );
  }

  const parameters = new URLSearchParams({
    format: 'json',
    include: 'data',
    q: cleanedQuery,
    qmode,
    itemType: '-attachment',
    limit: String(limit)
  });

  const url =
    `https://api.zotero.org/groups/${groupId}/items/top?` +
    parameters.toString();

  const controller = new AbortController();

  const timeoutId = setTimeout(() => {
    controller.abort();
  }, timeoutMilliseconds);

  console.log(
  'Starting Zotero API search:',
  {
    query: cleanedQuery,
    qmode,
    limit,
    timeoutMilliseconds,
    url
  }
);
  try {    
    const response = await fetch(url, {
      method: 'GET',
      headers: {
        'Zotero-API-Version':
          ZOTERO_CONFIG.apiVersion,
        Accept: 'application/json'
      },
      signal: controller.signal
    });
console.log(
  'Zotero API response received:',
  {
    query: cleanedQuery,
    status: response.status,
    ok: response.ok
  }
);

    if (!response.ok) {
      let details = '';

      try {
        details = await response.text();
      } catch {
        details = '';
      }

      throw new Error(
        `Zotero API returned HTTP ${response.status}` +
        (
          details
            ? `: ${details.slice(0, 180)}`
            : ''
        )
      );
    }

    const returnedItems = await response.json();
    console.log(
  'Zotero API items returned:',
  {
    query: cleanedQuery,
    itemCount: Array.isArray(returnedItems)? returnedItems.length: null
  }
);
    if (!Array.isArray(returnedItems)) {
      throw new Error(
        'Zotero returned an unexpected search response.'
      );
    }

    const items = returnedItems.filter(item => {
      const itemType =
        item &&
        item.data &&
        item.data.itemType;

      return (
        itemType &&
        itemType !== 'attachment' &&
        itemType !== 'note' &&
        itemType !== 'annotation'
      );
    });

    zoteroSearchCache.set(cacheKey, items);

    return items;
  } catch (error) {
    if (error.name === 'AbortError') {
      throw new Error(
        `Zotero search timed out after ` +
        `${Math.round(timeoutMilliseconds / 1000)} seconds.`
      );
    }

    throw error;
  } finally {
    clearTimeout(timeoutId);
  }
}

function buildZoteroQueriesForCitation(citation) {
  const queries = [];

  const key = String(citation.key || '')
    .replace(/\s+/g, ' ')
    .trim();

  if (!key) {
    return queries;
  }

  /*
    SKB report citation:

      SKB R-06-68

    Try the report code both with and without "SKB".
  */
  if (citation.type === 'skb-report') {
    queries.push({
      query: key,
      qmode: 'everything'
    });

    queries.push({
      query: key.replace(/^SKB\s+/i, ''),
      qmode: 'everything'
    });

    return deduplicateZoteroQueries(queries);
  }

  /*
    Author-year citation:

      Avila and Bergström 2006
      Öhman et al. 2014
      SSM 2017

    Remove citation syntax that may reduce Zotero quick-search quality.
  */
  if (citation.type === 'author-year') {
    const simplified = key
      .replace(/\bet\s+al\.?/gi, '')
      .replace(/\bm\.fl\.?/gi, '')
      .replace(/\b(?:and|och|&)\b/gi, ' ')
      .replace(/\s+/g, ' ')
      .trim();

    queries.push({
      query: simplified,
      qmode: 'titleCreatorYear'
    });

    /*
      First author and year is a useful fallback if Zotero does not
      return results for the complete citation.
    */
    const yearMatch = simplified.match(
      /\b(?:1[89]\d{2}|20\d{2})[a-z]?\b/i
    );

    const firstAuthor = simplified
      .replace(
        /\b(?:1[89]\d{2}|20\d{2})[a-z]?\b.*$/i,
        ''
      )
      .trim()
      .split(/\s+/)[0];

    if (firstAuthor && yearMatch) {
      queries.push({
        query: `${firstAuthor} ${yearMatch[0]}`,
        qmode: 'titleCreatorYear'
      });
    }

    return deduplicateZoteroQueries(queries);
  }

  /*
    Defined abbreviated citation name.
  */
  if (citation.type === 'abbreviated-name') {
    queries.push({
      query: key,
      qmode: 'titleCreatorYear'
    });

    queries.push({
      query: key,
      qmode: 'everything'
    });

    return deduplicateZoteroQueries(queries);
  }

  queries.push({
    query: key,
    qmode: 'titleCreatorYear'
  });

  return deduplicateZoteroQueries(queries);
}

function buildZoteroQueriesForReference(entry) {
  const queries = [];

  /*
    Report number is the strongest available search term.
  */
  const reportKey =
    getDocumentReferenceReportKey(entry);

  if (reportKey) {
    queries.push({
      query: reportKey,
      qmode: 'everything'
    });

    queries.push({
      query: reportKey.replace(/^SKB\s+/i, ''),
      qmode: 'everything'
    });
  }

  /*
    Search using the generated document key.
  */
  if (entry.key) {
    const simplifiedKey = String(entry.key)
      .replace(/\bet\s+al\.?/gi, '')
      .replace(/\bm\.fl\.?/gi, '')
      .replace(/\b(?:and|och|&)\b/gi, ' ')
      .replace(/\s+/g, ' ')
      .trim();

    queries.push({
      query: simplifiedKey,
      qmode: 'titleCreatorYear'
    });
  }

  /*
    Search with a distinctive initial title fragment.

    Limiting this avoids sending a very long query.
  */
  const title = getDocumentReferenceTitle(entry);

  if (title) {
    const titleQuery = title
      .split(/\s+/)
      .slice(0, 12)
      .join(' ');

    queries.push({
      query: titleQuery,
      qmode: 'titleCreatorYear'
    });
  }

  return deduplicateZoteroQueries(queries);
}

function deduplicateZoteroQueries(queries) {
  const seen = new Set();

  return queries.filter(item => {
    const key =
      `${item.qmode}||${item.query.toLowerCase()}`;

    if (
      !item.query ||
      seen.has(key)
    ) {
      return false;
    }

    seen.add(key);
    return true;
  });
}

async function searchZoteroWithFallbacks(
  queries,
  source,
  scoringFunction
) {
  const candidatesByKey = new Map();
  const errors = [];

  /*
    At most two queries per citation/reference. The first query should
    be the strongest one, and the second is a fallback.
  */
  const queriesToRun = queries.slice(0, 2);

  for (const search of queriesToRun) {
    showStatus(
      `Searching Zotero for ` +
      `“${truncate(search.query, 45)}”…`
    );

    await yieldToBrowser();

    let items;

    try {
      items = await searchZoteroItems(
        search.query,
        {
          qmode: search.qmode,
          limit:
            ZOTERO_CONFIG.searchResultLimit,
          timeoutMilliseconds:
            ZOTERO_CONFIG
              .searchTimeoutMilliseconds
        }
      );
    } catch (error) {
      console.warn(
        'Zotero search failed:',
        {
          query: search.query,
          qmode: search.qmode,
          error
        }
      );

      errors.push(
        error instanceof Error
          ? error.message
          : String(error)
      );

      /*
        Continue with the fallback query rather than stopping the
        complete analysis.
      */
      continue;
    }

    const preparedItems =
      prepareZoteroItems(items);

    for (const candidate of preparedItems) {
      const result = scoringFunction(
        source,
        candidate
      );

      const existing =
        candidatesByKey.get(candidate.key);

      if (
        !existing ||
        result.score > existing.score
      ) {
        candidatesByKey.set(
          candidate.key,
          {
            ...candidate,
            score: result.score,
            reasons: result.reasons,
            searchQuery: search.query
          }
        );
      }
    }

    const scores = [
      ...candidatesByKey.values()
    ].map(candidate => candidate.score);

    const bestScore =
      scores.length > 0
        ? Math.max(...scores)
        : 0;

    /*
      Do not run fallbacks when a confident match was already found.
    */
    if (bestScore >= 90) {
      break;
    }
  }

  /*
    If all searches failed, return no candidates. One failed Zotero
    lookup should not terminate the entire document analysis.
  */
  if (
    errors.length === queriesToRun.length &&
    queriesToRun.length > 0
  ) {
    console.warn(
      'All Zotero fallback searches failed:',
      errors
    );

    return [];
  }

  return [...candidatesByKey.values()]
    .filter(candidate => {
      return (
        candidate.score >=
        ZOTERO_CONFIG.minimumScore
      );
    })
    .sort((a, b) => b.score - a.score)
    .slice(
      0,
      ZOTERO_CONFIG.maximumCandidates
    );
}


async function analyseAgainstZotero(
  orphanCites,
  uncitedRefs
) {
  const orphanCitesToCheck = orphanCites.slice(
    0,
    ZOTERO_CONFIG.maximumOrphanLookups
  );

  const uncitedRefsToCheck = uncitedRefs.slice(
    0,
    ZOTERO_CONFIG.maximumUncitedLookups
  );

  const orphanMatches = [];

  for (
    let index = 0;
    index < orphanCitesToCheck.length;
    index++
  ) {
    const citation = orphanCitesToCheck[index];

    showStatus(
      `Searching Zotero for orphan citation ` +
      `${index + 1} of ${orphanCitesToCheck.length}: ` +
      `${truncate(citation.key, 35)}…`
    );

    await yieldToBrowser();

    const queries =
      buildZoteroQueriesForCitation(citation);

    const candidates =
      await searchZoteroWithFallbacks(
        queries,
        citation,
        scoreOrphanCitationAgainstZotero
      );

    orphanMatches.push({
      source: citation,
      candidates
    });
  }

  const uncitedMatches = [];

  for (
    let index = 0;
    index < uncitedRefsToCheck.length;
    index++
  ) {
    const entry = uncitedRefsToCheck[index];

    showStatus(
      `Searching Zotero for uncited reference ` +
      `${index + 1} of ${uncitedRefsToCheck.length}: ` +
      `${truncate(entry.key, 35)}…`
    );

    await yieldToBrowser();

    const queries =
      buildZoteroQueriesForReference(entry);

    const candidates =
      await searchZoteroWithFallbacks(
        queries,
        entry,
        scoreDocumentReferenceAgainstZotero
      );

    uncitedMatches.push({
      source: entry,
      candidates
    });
  }

  return {
    available: true,
    error: null,

    itemCount: countUniqueZoteroCandidates(
      orphanMatches,
      uncitedMatches
    ),

    orphanMatches,
    uncitedMatches,

    skippedOrphanCount:
      orphanCites.length -
      orphanCitesToCheck.length,

    skippedUncitedCount:
      uncitedRefs.length -
      uncitedRefsToCheck.length
  };
}

function countUniqueZoteroCandidates(
  orphanMatches,
  uncitedMatches
) {
  const keys = new Set();

  for (const result of [
    ...orphanMatches,
    ...uncitedMatches
  ]) {
    for (const candidate of result.candidates) {
      if (candidate.key) {
        keys.add(candidate.key);
      }
    }
  }

  return keys.size;
}



/*
  Extract a plausible publication year from a Zotero date field.

  Handles values such as:

    2019
    2019-05
    2019-05-14
    May 2019
*/
function getZoteroYear(item) {
  const date =
    item &&
    item.data &&
    item.data.date
      ? String(item.data.date)
      : '';

  const match = date.match(
    /\b(?:1[89]\d{2}|20\d{2})[a-z]?\b/i
  );

  return match ? match[0] : null;
}

/*
  Return author/creator surnames from a Zotero item.
*/
function getZoteroAuthors(item) {
  const creators =
    item &&
    item.data &&
    Array.isArray(item.data.creators)
      ? item.data.creators
      : [];

  return creators
    .filter(creator => {
      if (!creator) {
        return false;
      }

      return [
        'author',
        'bookAuthor',
        'reporter',
        'inventor',
        'programmer'
      ].includes(creator.creatorType);
    })
    .map(creator => {
      return String(
        creator.lastName ||
        creator.name ||
        ''
      ).trim();
    })
    .filter(Boolean);
}

/*
  Return a report number from commonly used Zotero report fields.
*/
function getZoteroReportNumber(item) {
  const data = item && item.data
    ? item.data
    : {};

  const directValue = String(
    data.reportNumber ||
    data.number ||
    ''
  ).trim();

  if (directValue) {
    return directValue;
  }

  /*
    As a fallback, look in Extra. Institutional libraries sometimes
    carry report metadata there.
  */
  const extra = String(data.extra || '');

  const extraMatch = extra.match(
    /(?:report\s*(?:number|no\.?)|number)\s*:\s*([^\r\n]+)/i
  );

  return extraMatch
    ? extraMatch[1].trim()
    : '';
}

/*
  Extract an SKB report identifier from all useful Zotero metadata.
*/
function getZoteroSkbReportKey(item) {
  const data = item && item.data
    ? item.data
    : {};

  const searchableText = [
    getZoteroReportNumber(item),
    data.title,
    data.shortTitle,
    data.seriesTitle,
    data.series,
    data.extra
  ]
    .filter(Boolean)
    .join(' ');

  return extractSkbReportKey(searchableText);
}

/*
  Build the standard author-year key from Zotero metadata.
*/
function getZoteroAuthorYearKey(item) {
  const authors = getZoteroAuthors(item);
  const year = getZoteroYear(item);

  if (!year || authors.length === 0) {
    return null;
  }

  if (authors.length === 1) {
    return `${authors[0]} ${year}`;
  }

  if (authors.length === 2) {
    return (
      `${authors[0]} and ${authors[1]} ${year}`
    );
  }

  return `${authors[0]} et al. ${year}`;
}

/*
  Build all useful aliases for a Zotero item.
*/
function getZoteroAliases(item) {
  const aliases = new Set();

  const authorYear =
    getZoteroAuthorYearKey(item);

  if (authorYear) {
    aliases.add(authorYear);
  }

  const reportKey =
    getZoteroSkbReportKey(item);

  if (reportKey) {
    aliases.add(reportKey);
  }

  const data = item && item.data
    ? item.data
    : {};

  /*
    If a short title has been defined in Zotero, treat it as a possible
    abbreviated citation name.
  */
  if (data.shortTitle) {
    aliases.add(
      String(data.shortTitle).trim()
    );
  }

  return [...aliases].filter(Boolean);
}

/*
  Produce a normalized title suitable for similarity comparison.
*/
function normaliseTitle(value) {
  return normaliseDashes(value || '')
    .normalize('NFC')
    .toLowerCase()
    .replace(/&/g, ' and ')
    .replace(/[^a-zà-öø-ÿ0-9]+/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

/*
  Convert text into word tokens while ignoring very short words.
*/
function titleTokens(value) {
  return new Set(
    normaliseTitle(value)
      .split(' ')
      .filter(word => word.length >= 3)
  );
}

/*
  Jaccard-style title similarity from 0 to 1.
*/
function titleSimilarity(a, b) {
  const first = titleTokens(a);
  const second = titleTokens(b);

  if (first.size === 0 || second.size === 0) {
    return 0;
  }

  let common = 0;

  for (const token of first) {
    if (second.has(token)) {
      common++;
    }
  }

  const union =
    first.size + second.size - common;

  return union > 0
    ? common / union
    : 0;
}

/*
  Extract the first plausible title portion from a parsed document
  reference.

  This does not need to be perfect. It is used only as one component of
  a candidate score.
*/
function getDocumentReferenceTitle(entry) {
  let text = String(entry.body || '').trim();

  /*
    Remove a leading SKB code.
  */
  text = text.replace(
    /^\s*SKB\s+(?:TR|R|P|IPR|RD|SR|TM|U|F)-\d{2,}-\d+\s*[.,]?\s*/i,
    ''
  );

  /*
    Remove a leading comma-separated author list and year.
  */
  text = text.replace(
    /^.+?,\s*(?:1[89]\d{2}|20\d{2})[a-z]?\s*[.]\s*/,
    ''
  );

  /*
    Remove a simple author-year prefix.
  */
  text = text.replace(
    /^.+?\s+(?:1[89]\d{2}|20\d{2})[a-z]?\s*[.]\s*/,
    ''
  );

  /*
    The first sentence normally contains the title.
  */
  const firstSentence = text.split(/\.\s+/)[0];

  return firstSentence.trim();
}

/*
  Extract a year directly from a document reference.
*/
function getDocumentReferenceYear(entry) {
  const match = String(entry.body || '').match(
    /\b(?:1[89]\d{2}|20\d{2})[a-z]?\b/i
  );

  return match ? match[0] : null;
}

/*
  Extract an SKB report key from a document reference.
*/
function getDocumentReferenceReportKey(entry) {
  return extractSkbReportKey(
    entry.body || ''
  );
}

/*
  Create candidate-scoring metadata once for each Zotero item.
*/
function prepareZoteroItems(items) {
  return items.map(item => {
    const data = item.data || {};

    const aliases = getZoteroAliases(item);

    return {
      item,
      key: item.key,
      title: String(data.title || '').trim(),
      shortTitle: String(
        data.shortTitle || ''
      ).trim(),
      year: getZoteroYear(item),
      authors: getZoteroAuthors(item),
      authorYearKey:
        getZoteroAuthorYearKey(item),
      reportKey:
        getZoteroSkbReportKey(item),
      reportNumber:
        getZoteroReportNumber(item),
      aliases,
      normalizedAliases: aliases.map(
        normaliseKey
      ),
      itemType: data.itemType || '',
      url: createZoteroItemUrl(item)
    };
  });
}

/*
  Link to the item in the public Zotero group library.
*/
function createZoteroItemUrl(item) {
  if (
    item &&
    item.links &&
    item.links.alternate &&
    item.links.alternate.href
  ) {
    return item.links.alternate.href;
  }

  const groupId = String(
    ZOTERO_CONFIG.groupId
  );

  const itemKey =
    item && item.key
      ? item.key
      : '';

  return (
    `https://www.zotero.org/groups/` +
    `${encodeURIComponent(groupId)}/items/` +
    `${encodeURIComponent(itemKey)}`
  );
}

/*
  Rank one orphan in-text citation against a Zotero item.
*/
function scoreOrphanCitationAgainstZotero(
  citation,
  candidate
) {
  let score = 0;
  const reasons = [];

  const citationKey = normaliseKey(
    citation.key
  );

  /*
    An exact generated alias is the strongest match.
  */
  if (
    candidate.normalizedAliases.includes(
      citationKey
    )
  ) {
    score += 90;
    reasons.push('exact citation alias');
  }

  /*
    Exact report-number matches are effectively identifiers.
  */
  if (
    citation.type === 'skb-report' &&
    candidate.reportKey &&
    normaliseKey(candidate.reportKey) === citationKey
  ) {
    score = Math.max(score, 98);
    reasons.push('exact SKB report number');
  }

  /*
    Compare citation year to Zotero year.
  */
  const citationYear =
    citation.year ||
    (
      String(citation.key).match(
        /\b(?:1[89]\d{2}|20\d{2})[a-z]?\b/i
      ) || []
    )[0] ||
    null;

  if (
    citationYear &&
    candidate.year &&
    citationYear.toLowerCase() ===
      candidate.year.toLowerCase()
  ) {
    score += 10;
    reasons.push('same year');
  }

  /*
    Compare the leading cited surname with Zotero's first author.
  */
  if (
    citation.author &&
    candidate.authors.length > 0
  ) {
    const citedFirstName = String(
      citation.author
    )
      .replace(/\s+(?:et\s+al\.?|m\.fl\.?).*$/i, '')
      .replace(/\s+(?:and|och|&).*$/i, '')
      .trim();

    const zoteroFirstName =
      candidate.authors[0];

    if (
      normaliseKey(citedFirstName) ===
      normaliseKey(zoteroFirstName)
    ) {
      score += 25;
      reasons.push('same first author');
    }
  }

  return {
    score: Math.min(score, 100),
    reasons
  };
}

/*
  Rank one uncited document reference against a Zotero item.
*/
function scoreDocumentReferenceAgainstZotero(
  entry,
  candidate
) {
  let score = 0;
  const reasons = [];

  const entryAliases = new Set(
    (entry.aliases || [entry.key])
      .map(normaliseKey)
  );

  /*
    Exact document-key or alias match.
  */
  for (const alias of candidate.normalizedAliases) {
    if (entryAliases.has(alias)) {
      score += 65;
      reasons.push('exact reference alias');
      break;
    }
  }

  /*
    Exact report-number match.
  */
  const documentReportKey =
    getDocumentReferenceReportKey(entry);

  if (
    documentReportKey &&
    candidate.reportKey &&
    normaliseKey(documentReportKey) ===
      normaliseKey(candidate.reportKey)
  ) {
    score += 70;
    reasons.push('exact SKB report number');
  }

  /*
    Same publication year.
  */
  const documentYear =
    getDocumentReferenceYear(entry);

  if (
    documentYear &&
    candidate.year &&
    documentYear.toLowerCase() ===
      candidate.year.toLowerCase()
  ) {
    score += 10;
    reasons.push('same year');
  }

  /*
    Title similarity.
  */
  const documentTitle =
    getDocumentReferenceTitle(entry);

  if (
    documentTitle &&
    candidate.title
  ) {
    const similarity = titleSimilarity(
      documentTitle,
      candidate.title
    );

    if (similarity >= 0.85) {
      score += 35;
      reasons.push('very similar title');
    } else if (similarity >= 0.65) {
      score += 25;
      reasons.push('similar title');
    } else if (similarity >= 0.45) {
      score += 15;
      reasons.push('partly similar title');
    }
  }

  return {
    score: Math.min(score, 100),
    reasons
  };
}



  // ── Render results ────────────────────────────────────────────────────────
  function renderResults(filename, refEntries, inTextCites, report, formatIssues, totalParas, refListStart, isSwedish, zoteroResult) {
    const { orphanCites, uncitedRefs } = report;

    // Document info
    const refSection = refListStart >= 0
      ? `Reference list found at paragraph ${refListStart + 1} of ${totalParas}.`
      : '<strong style="color:var(--color-kvot-accent)">No reference list section detected.</strong> The tool scanned the full document for references.';
    docInfo.innerHTML = `<strong>${escHtml(filename)}</strong>
      ${isSwedish ? '<span style="background:color-mix(in srgb,#5cb85c 12%,var(--bg-secondary));color:#357a35;border:1px solid #5cb85c;border-radius:6px;padding:1px 8px;font-size:.78rem;font-weight:700;margin-left:4px">🇸🇪 Svenska</span>' : ''}
      &mdash; ${totalParas} paragraphs &nbsp;·&nbsp; 
      ${refEntries.length} reference list entries &nbsp;·&nbsp; 
      ${inTextCites.length} in-text citation occurrences &nbsp;·&nbsp; 
      ${refSection}`;
    docInfo.classList.add('show');

    // Summary cards
    const nIssues = formatIssues.length;
    const nOrphan = orphanCites.length;
    const nCited  = refEntries.filter(e => e.cites.length > 0).length;
    const nTotal  = refEntries.length;

    setText('cnt-total',  nTotal);
    setText('cnt-cited',  nCited);
    setText('cnt-orphan', nOrphan);
    setText('cnt-issues', nIssues);

    setCardClass('card-total',  nTotal > 0  ? 'ok' : 'warn');
    setCardClass('card-cited',  nCited === nTotal && nTotal > 0 ? 'ok' : nCited > 0 ? '' : 'warn');
    setCardClass('card-orphan', nOrphan === 0 ? 'ok' : 'warn');
    setCardClass('card-issues', nIssues === 0 ? 'ok' : 'warn');
    summCards.classList.add('show');

    // Results sections
    let html = '';

    // 1. All references with citation counts
    html += buildRefListSection(refEntries);

    // 2. Orphan in-text citations
    html += buildOrphanSection(orphanCites);

    // 3. Uncited references
    html += buildUncitedSection(uncitedRefs);

    // 4. Probable Zotero matches
html += buildZoteroMatchSection(
  zoteroResult
);

// 5. Format issues
html += buildFormatSection(
  formatIssues,
  refEntries
);

    results.innerHTML = html;
    resetBtn.classList.add('show');

    // Open first section if issues found
    if (nOrphan > 0 || nIssues > 0) {
      const firstDetails = results.querySelector('details.result-section');
      if (firstDetails) firstDetails.open = true;
    }
  }

  function buildRefListSection(refEntries) {
    const badge = refEntries.length > 0
      ? `<span class="section-badge good">${refEntries.length}</span>`
      : `<span class="section-badge error">none</span>`;

    let rows = '';
    if (refEntries.length === 0) {
      rows = `<tr><td colspan="4"><em class="empty-notice">No reference list detected in document.</em></td></tr>`;
    } else {
      for (const e of refEntries) {
        const n = e.cites.length;
        const cls = n === 0 ? 'warn-row' : '';
        // Unique section labels where this reference is cited
        const secs = [...new Map(e.cites.map(c => [c.section || '', c])).keys()]
          .filter(Boolean).slice(0, 5).map(s => escHtml(truncate(s, 50)));
        const locText = secs.length > 0
          ? secs.join('<br>')
          : (e.cites.length > 0 ? '(no heading found)' : '');
        rows += `<tr class="${cls}">
          <td><span class="ref-key">${escHtml(e.key)}</span></td>
          <td class="ref-text">${truncate(escHtml(e.body), 150)}</td>
          <td class="cite-count">${n === 0 ? '<span style="color:var(--color-kvot-accent)">0 ⚠</span>' : n}</td>
          <td class="cite-pages" style="font-size:.8rem">${locText}</td>
        </tr>`;
      }
    }
    return `<details class="result-section" ${refEntries.length > 0 ? 'open' : ''}>
      <summary>Reference list entries ${badge}</summary>
      <div class="section-body">
        <table class="ref-table">
          <thead><tr>
            <th>Key</th><th>Reference text</th><th>Cited (#)</th><th>In section(s)</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </details>`;
  }

  function buildOrphanSection(orphanCites) {
    const n = orphanCites.length;
    const badgeCls = n === 0 ? 'good' : 'error';
    const badge = `<span class="section-badge ${badgeCls}">${n === 0 ? '✓ none' : n}</span>`;

    let body = '';
    if (n === 0) {
      body = `<p class="empty-notice">All in-text citations match a reference list entry.</p>`;
    } else {
      const rows = orphanCites.map(c => {
        const sec = c.section ? truncate(c.section, 55) : '—';
        return `<tr class="error-row">
          <td><span class="ref-key">${escHtml(c.key)}</span></td>
          <td class="ref-text">${truncate(escHtml(c.paraText), 100)}</td>
          <td style="font-size:.8rem;color:var(--text-secondary)">${escHtml(sec)}</td>
          <td style="font-size:.8rem;color:var(--text-muted)">${escHtml(c.type)}</td>
        </tr>`;
      }).join('');
      body = `<table class="ref-table">
        <thead><tr><th>Citation</th><th>Context</th><th>In section</th><th>Type</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
    }
    return `<details class="result-section" ${n > 0 ? 'open' : ''}>
      <summary>In-text citations with no matching reference list entry ${badge}</summary>
      <div class="section-body">${body}</div>
    </details>`;
  }

  function buildUncitedSection(uncitedRefs) {
    const n = uncitedRefs.length;
    const badgeCls = n === 0 ? 'good' : 'warn';
    const badge = `<span class="section-badge ${badgeCls}">${n === 0 ? '✓ none' : n}</span>`;

    let body = '';
    if (n === 0) {
      body = `<p class="empty-notice">Every reference in the list is cited at least once.</p>`;
    } else {
      body = `<div class="tag-list">` +
        uncitedRefs.map(e => `<div class="tag warn-tag">⚠ <code>${escHtml(e.key)}</code></div>`).join('') +
        `</div>
        <p style="margin-top:12px;font-size:.84rem;color:var(--text-muted)">
          These references appear in the list but are never cited in the body text.
          Consider removing them or adding in-text citations.
        </p>`;
    }
    return `<details class="result-section">
      <summary>Reference list entries never cited in text ${badge}</summary>
      <div class="section-body">${body}</div>
    </details>`;
  }
function buildZoteroMatchSection(zoteroResult) {
  /*
    Zotero is not configured or the request failed.
  */
  if (
    !zoteroResult ||
    !zoteroResult.available
  ) {
    const message =
      zoteroResult &&
      zoteroResult.error
        ? escHtml(zoteroResult.error)
        : 'Zotero lookup was not performed.';

    return `
      <details class="result-section">
        <summary>
          Probable matches in Zotero
          <span class="section-badge warn">
            unavailable
          </span>
        </summary>
        <div class="section-body">
          <p class="empty-notice">
            ${message}
          </p>
        </div>
      </details>
    `;
  }

  const orphanResults =
    zoteroResult.orphanMatches.filter(
      result => result.candidates.length > 0
    );

  const uncitedResults =
    zoteroResult.uncitedMatches.filter(
      result => result.candidates.length > 0
    );

  const matchCount =
    orphanResults.length +
    uncitedResults.length;

  const badgeClass =
    matchCount > 0 ? 'warn' : 'good';

  const badgeText =
    matchCount > 0
      ? String(matchCount)
      : '✓ none';

  let body = `
    <p style="
      margin:0 0 14px;
      font-size:.84rem;
      color:var(--text-secondary);
    ">Examined
<strong>${zoteroResult.itemCount}</strong>
distinct Zotero records returned by targeted searches of the public
<code>skb_references</code> library.
      These are suggestions only; document results have not been
      changed automatically.
    </p>
  `;

  if (matchCount === 0) {
    body += `
      <p class="empty-notice">
        No probable Zotero matches were found for orphan citations
        or uncited document references.
      </p>
    `;
  }

  if (orphanResults.length > 0) {
    body += `
      <h3 style="
        margin:8px 0 10px;
        font-size:.9rem;
        color:var(--text-primary);
      ">
        Orphan citations with probable Zotero matches
      </h3>
      ${buildZoteroCandidateTable(
        orphanResults,
        'citation'
      )}
    `;
  }

  if (uncitedResults.length > 0) {
    body += `
      <h3 style="
        margin:18px 0 10px;
        font-size:.9rem;
        color:var(--text-primary);
      ">
        Uncited references with probable Zotero matches
      </h3>
      ${buildZoteroCandidateTable(
        uncitedResults,
        'reference'
      )}
    `;
  }

  return `
    <details class="result-section"
      ${matchCount > 0 ? 'open' : ''}>
      <summary>
        Probable matches in Zotero
        <span class="section-badge ${badgeClass}">
          ${badgeText}
        </span>
      </summary>
      <div class="section-body">
        ${body}
      </div>
    </details>
  `;
}

function buildZoteroCandidateTable(
  results,
  sourceType
) {
  const rows = results.map(result => {
    const sourceText =
      sourceType === 'citation'
        ? result.source.key
        : result.source.key;

    const candidatesHtml = result.candidates
      .map(candidate => {
        const authors =
          candidate.authors.length > 0
            ? candidate.authors.join(', ')
            : 'No creator recorded';

        const year =
          candidate.year || 'No year';

        const reasonText =
          candidate.reasons.length > 0
            ? candidate.reasons.join(', ')
            : 'metadata similarity';

        const reportText =
          candidate.reportKey
            ? `<div style="
                 margin-top:3px;
                 color:var(--text-muted);
               ">
                 ${escHtml(candidate.reportKey)}
               </div>`
            : '';

        return `
          <div style="
            margin-bottom:10px;
            padding:9px 11px;
            border:1px solid var(--border-color);
            border-radius:8px;
            background:var(--bg-surface);
          ">
            <div style="
              display:flex;
              align-items:flex-start;
              gap:8px;
            ">
              <strong style="
                color:var(--text-primary);
                flex:1;
              ">
                ${escHtml(
                  candidate.title ||
                  '(untitled Zotero item)'
                )}
              </strong>

              <span class="section-badge ${
                candidate.score >= 90
                  ? 'good'
                  : 'warn'
              }" style="margin-left:0">
                ${candidate.score}%
              </span>
            </div>

            <div style="
              margin-top:4px;
              font-size:.8rem;
              color:var(--text-secondary);
            ">
              ${escHtml(authors)}
              ·
              ${escHtml(year)}
            </div>

            ${reportText}

            <div style="
              margin-top:4px;
              font-size:.76rem;
              color:var(--text-muted);
            ">
              Match basis: ${escHtml(reasonText)}
            </div>

            <div style="margin-top:6px">
              <a href="${escHtml(candidate.url)}" 
              target="_blank"
              rel="noopener noreferrer"
              style="
                color:var(--color-kvot-bright);
                font-size:.8rem;
              ">
                Open Zotero record ↗
              </a>
            </div>
          </div>
        `;
      })
      .join('');

    return `
      <tr>
        <td style="width:28%;vertical-align:top">
          <span class="ref-key">
            ${escHtml(sourceText)}
          </span>
        </td>
        <td>
          ${candidatesHtml}
        </td>
      </tr>
    `;
  }).join('');

  return `
    <table class="ref-table">
      <thead>
        <tr>
          <th>
            ${
              sourceType === 'citation'
                ? 'Orphan citation'
                : 'Uncited reference'
            }
          </th>
          <th>Probable Zotero record(s)</th>
        </tr>
      </thead>
      <tbody>
        ${rows}
      </tbody>
    </table>
  `;
}

  function buildFormatSection(issues, refEntries) {
    const n = issues.length;
    const badgeCls = n === 0 ? 'good' : 'warn';
    const badge = `<span class="section-badge ${badgeCls}">${n === 0 ? '✓ none' : n}</span>`;

    let body = '';
    if (n === 0) {
      body = `<p class="empty-notice">No SKB format rule violations detected.</p>`;
    } else {
      // Group by key
      const byKey = new Map();
      for (const iss of issues) {
        if (!byKey.has(iss.key)) byKey.set(iss.key, []);
        byKey.get(iss.key).push(iss);
      }
      // Find ref entry text for each key
      const refMap = new Map(refEntries.map(e => [e.key, e.body]));

      let rows = '';
      for (const [key, iss] of byKey) {
        const sevClass = iss.some(i => i.severity === 'error') ? 'error-row' :
                         iss.some(i => i.severity === 'warn')  ? 'warn-row' : '';
        const issHtml = `<ul class="issue-list">${iss.map(i => `<li>[${i.severity.toUpperCase()}] ${escHtml(i.issue)}</li>`).join('')}</ul>`;
        rows += `<tr class="${sevClass}">
          <td><span class="ref-key">${escHtml(key)}</span></td>
          <td class="ref-text">${truncate(escHtml(refMap.get(key) || ''), 100)}</td>
          <td>${issHtml}</td>
        </tr>`;
      }
      body = `<p style="font-size:.84rem;color:var(--text-secondary);margin-bottom:12px;">
        Rules checked: year present · SKB report number format · author identifiable · 
        entry completeness · URL access date · end punctuation · sequential numbering.
      </p>
      <table class="ref-table">
        <thead><tr><th>Key</th><th>Reference text</th><th>Issues</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
    }
    return `<details class="result-section">
      <summary>SKB format rule issues ${badge}</summary>
      <div class="section-body">${body}</div>
    </details>`;
  }

  // ── Utility ───────────────────────────────────────────────────────────────
  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function truncate(s, n) { return s.length > n ? s.slice(0, n) + '…' : s; }
  function setText(id, val) { const el = document.getElementById(id); if (el) el.textContent = val; }
  function setCardClass(id, cls) {
    const el = document.getElementById(id);
    if (!el) return;
    el.classList.remove('warn','ok');
    if (cls) el.classList.add(cls);
  }
  </script>
</body>
</html>
