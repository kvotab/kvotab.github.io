<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.2/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.2/dist/leaflet.js"></script>
  <link rel="stylesheet" href="./resources/css/kvot.css">
  <link rel="icon" type="image/x-icon" href="./resources/images/favicon.ico">
  <title>SKB Reference Checker</title>
  <style>
    header { position: fixed; inset: 0 0 auto; z-index: 20; background: var(--footer-bg); box-shadow: 0 2px 8px rgba(0,0,0,.12); }
    body { overflow-x: hidden; }
    .content { min-height: calc(100vh - 104px); padding: 56px 0 48px; }
    #app { box-sizing: border-box; width: 100%; max-width: 980px; margin: 0 auto; padding: 28px 28px 56px; }

    #dropzone { margin-bottom: 24px; padding: 48px 24px; border: 2px dashed var(--border-color); border-radius: 14px; background: var(--bg-secondary); text-align: center; cursor: pointer; transition: border-color .15s, background .15s; }
    #dropzone.drag-over { border-color: var(--color-kvot-bright); background: color-mix(in srgb, var(--color-kvot-bright) 6%, var(--bg-secondary)); }
    #dropzone input { display: none; }
    #dropzone .dz-icon { margin-bottom: 10px; font-size: 2.4rem; opacity: .6; }
    #dropzone .dz-label { margin-bottom: 4px; color: var(--text-primary); font-size: 1rem; font-weight: 600; }
    #dropzone .dz-sub { color: var(--text-muted); font-size: .84rem; }
    .primary-btn { display: inline-block; padding: 8px 20px; border: 0; border-radius: 20px; background: var(--color-kvot-bright); color: #fff; font-size: .88rem; font-weight: 600; cursor: pointer; transition: opacity .15s; }
    #dropzone .primary-btn { margin-top: 14px; }
    .primary-btn:hover:not(:disabled) { opacity: .88; }
    .primary-btn:disabled { cursor: wait; opacity: .6; }

    #status-bar { display: none; align-items: center; gap: 10px; margin-bottom: 20px; padding: 12px 16px; border: 1px solid var(--border-color); border-radius: 10px; background: var(--bg-secondary); color: var(--text-secondary); font-size: .88rem; }
    #status-bar.show { display: flex; }
    .spinner { width: 16px; height: 16px; flex: 0 0 auto; border: 2px solid var(--border-color); border-top-color: var(--color-kvot-bright); border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    #doc-info { display: none; margin-bottom: 20px; padding: 10px 16px; border: 1px solid var(--border-color); border-radius: 8px; background: var(--bg-secondary); color: var(--text-secondary); font-size: .84rem; line-height: 1.6; }
    #doc-info.show { display: block; }
    #doc-info strong { color: var(--text-primary); }

    #summary-cards { display: none; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
    #summary-cards.show { display: grid; }
    .sum-card { padding: 14px 16px; border: 1px solid var(--border-color); border-radius: 10px; background: var(--bg-secondary); text-align: center; }
    .sum-card.warn { border-color: var(--color-kvot-accent); background: color-mix(in srgb, var(--color-kvot-accent) 8%, var(--bg-secondary)); }
    .sum-card.ok { border-color: #5cb85c; background: color-mix(in srgb, #5cb85c 8%, var(--bg-secondary)); }
    .sum-label { margin-bottom: 4px; color: var(--text-muted); font-size: .7rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; }
    .sum-value { color: var(--text-primary); font: 700 1.5rem 'SF Mono', Menlo, monospace; }
    .sum-card.warn .sum-value { color: var(--color-kvot-accent); }
    .sum-card.ok .sum-value { color: #5cb85c; }

    /* Animated progress bar used during document processing. */
    #progress-track {
      display: none;
      position: relative;
      height: 7px;
      margin: -10px 0 20px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--border-color);
    }
    #progress-track.show { display: block; }
    #progress-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: var(--color-kvot-bright);
      transition: width .28s ease;
    }
    #progress-track.indeterminate #progress-fill {
      width: 35%;
      animation: progress-sweep 1.15s ease-in-out infinite;
    }
    @keyframes progress-sweep {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(320%); }
    }
    @media (prefers-reduced-motion: reduce) {
      #progress-fill { transition: none; }
      #progress-track.indeterminate #progress-fill { animation-duration: 2.5s; }
    }

    #result-actions {
      display: none;
      justify-content: flex-end;
      margin: -4px 0 20px;
    }
    #result-actions.show { display: flex; }
    #zotero-search-options {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-right: auto;
      color: var(--text-secondary);
      font-size: .84rem;
      cursor: pointer;
    }
    #zotero-search-options input { accent-color: var(--color-kvot-bright); }
    #download-results-btn {
      padding: 7px 16px;
      border: 1px solid var(--border-color);
      border-radius: 20px;
      background: var(--bg-secondary);
      color: var(--text-primary);
      font-size: .84rem;
      font-weight: 600;
      cursor: pointer;
    }
    #download-results-btn:hover { border-color: var(--color-kvot-bright); }

    #reset-btn { display: none; float: right; margin-top: -4px; padding: 5px 14px; border: 1px solid var(--border-color); border-radius: 8px; background: var(--bg-secondary); color: var(--text-secondary); font-size: .82rem; cursor: pointer; }
    #reset-btn.show { display: inline-block; }
    #reset-btn:hover { border-color: var(--color-kvot-bright); color: var(--text-primary); }

    .result-section { margin-bottom: 16px; border-radius: 10px; }
    .result-section summary { display: flex; align-items: center; gap: 8px; padding: 11px 16px; border: 1px solid var(--border-color); border-radius: 10px; background: var(--bg-secondary); color: var(--text-primary); font-size: .88rem; font-weight: 600; cursor: pointer; list-style: none; user-select: none; }
    .result-section summary::-webkit-details-marker { display: none; }
    .result-section summary::before { content: '▸'; flex: 0 0 auto; color: var(--text-muted); font-size: .72em; transition: transform .2s; }
    .result-section[open] > summary::before { transform: rotate(90deg); }
    .result-section[open] > summary { border-radius: 10px 10px 0 0; border-bottom-color: transparent; }
    .result-section summary:hover { border-color: var(--color-kvot-bright); background: var(--bg-surface); }
    .section-body { padding: 16px 18px; border: 1px solid var(--border-color); border-top: 0; border-radius: 0 0 10px 10px; background: var(--bg-secondary); }
    .section-badge { margin-left: auto; padding: 2px 10px; border-radius: 12px; background: var(--border-color); color: var(--text-muted); font-size: .74rem; font-weight: 700; }
    .section-badge.error { background: color-mix(in srgb, var(--color-kvot-accent) 18%, var(--bg-secondary)); color: var(--color-kvot-accent); }
    .section-badge.warn { background: color-mix(in srgb, #f0ad4e 18%, var(--bg-secondary)); color: #c87d0a; }
    .section-badge.good { background: color-mix(in srgb, #5cb85c 18%, var(--bg-secondary)); color: #357a35; }

    .ref-table { width: 100%; border-collapse: collapse; font-size: .86rem; }
    .ref-table th { padding: 8px 10px; border-bottom: 1px solid var(--border-color); color: var(--text-muted); font-size: .72rem; font-weight: 700; letter-spacing: .06em; text-align: left; text-transform: uppercase; white-space: nowrap; }
    .ref-table td { padding: 8px 10px; border-bottom: 1px solid var(--border-color); line-height: 1.4; vertical-align: top; }
    .ref-table tr:last-child td { border-bottom: 0; }
    .ref-table tr:hover td { background: var(--bg-surface); }
    .ref-key { color: var(--color-kvot-accent); font: .83rem 'SF Mono', Menlo, monospace; white-space: nowrap; }
    .ref-text { max-width: 420px; color: var(--text-secondary); }
    .cite-count { color: var(--text-primary); font-weight: 700; }
    .cite-pages { margin-top: 2px; color: var(--text-muted); font-size: .78rem; }
    .warn-row td { background: color-mix(in srgb, #f0ad4e 5%, var(--bg-secondary)); }
    .error-row td { background: color-mix(in srgb, var(--color-kvot-accent) 5%, var(--bg-secondary)); }
    .issue-list { margin: 0; padding-left: 16px; color: var(--color-kvot-accent); font-size: .84rem; }
    .tag-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border: 1px solid var(--border-color); border-radius: 14px; background: var(--bg-secondary); font-size: .82rem; font-weight: 500; }
    .tag.warn-tag { border-color: #f0ad4e; background: color-mix(in srgb, #f0ad4e 8%, var(--bg-secondary)); color: #c87d0a; }
    .empty-notice { padding: 6px 0; color: var(--text-muted); font-size: .88rem; font-style: italic; }

    .zotero-cell { min-width: 165px; }
    .zotero-row-btn {
      padding: 6px 12px;
      border: 1px solid var(--color-kvot-bright);
      border-radius: 16px;
      background: var(--bg-secondary);
      color: var(--color-kvot-bright);
      font-size: .78rem;
      font-weight: 700;
      cursor: pointer;
    }
    .zotero-row-btn:hover:not(:disabled) { background: var(--bg-surface); }
    .zotero-row-btn.searching { border-color: var(--color-kvot-accent); color: var(--color-kvot-accent); }
    .zotero-inline-results { margin-top: 8px; }
    .zotero-inline-status { color: var(--text-muted); font-size: .78rem; }
    .zotero-candidate {
      margin-top: 8px;
      padding: 9px 10px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: var(--bg-surface);
      color: var(--text-secondary);
      font-size: .8rem;
    }
    .zotero-candidate-head { display: flex; align-items: flex-start; gap: 8px; }
    .zotero-candidate-title { flex: 1; color: var(--text-primary); font-weight: 700; }
    .zotero-probability { flex: 0 0 auto; padding: 2px 7px; border-radius: 10px; background: color-mix(in srgb, #5cb85c 18%, var(--bg-secondary)); color: #357a35; font-weight: 700; }
    .zotero-candidate a { color: var(--color-kvot-bright); }

    @media (max-width: 700px) { #summary-cards { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 480px) { #app { padding: 14px 12px 32px; } #summary-cards { gap: 8px; } }
  </style>
</head>
<body>
  <header></header>
  <div class="content">
    <div id="app">
      <button id="reset-btn" title="Analyse another document">↩ New document</button>
      <div id="dropzone" role="region" aria-label="Upload Word document">
        <input type="file" id="file-input" accept=".docx">
        <div class="dz-icon">📄</div>
        <div class="dz-label">Drop a Word file here</div>
        <div class="dz-sub">or click to browse — .docx only</div>
        <button class="primary-btn" id="choose-file-btn" type="button">Choose file</button>
      </div>
      <div id="status-bar"><div class="spinner"></div><span id="status-msg">Analysing…</span></div>
      <div id="progress-track" role="progressbar" aria-label="Processing progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="progress-fill"></div>
      </div>
      <div id="doc-info"></div>
      <div id="summary-cards">
        <div class="sum-card" id="card-total"><div class="sum-label">References in list</div><div class="sum-value" id="cnt-total">—</div></div>
        <div class="sum-card" id="card-cited"><div class="sum-label">Cited in text</div><div class="sum-value" id="cnt-cited">—</div></div>
        <div class="sum-card" id="card-orphan"><div class="sum-label">Orphan in-text</div><div class="sum-value" id="cnt-orphan">—</div></div>
        <div class="sum-card" id="card-issues"><div class="sum-label">Format issues</div><div class="sum-value" id="cnt-issues">—</div></div>
      </div>
      <div id="result-actions">
        <label id="zotero-search-options" title="When enabled, show plausible matches based on similar author names, years, titles, and report numbers, even when metadata is not identical.">
          <input id="zotero-fuzzy-match" type="checkbox" checked>
          Include fuzzy Zotero matches
        </label>
        <button id="download-results-btn" type="button" title="Download the current document analysis and any completed Zotero results as a standalone HTML file">Download analysis report</button>
      </div>
      <div id="results"></div>
    </div>
    <div id="map"></div>
  </div>
  <footer></footer>

  <script src="./resources/js/site.js"></script>
  <script>
    KVOT.renderHeader('SKB Reference Checker');
    KVOT.renderNav('skbref.html');
    KVOT.renderFooter();
    KVOT.initMap('map');
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script>
    'use strict';

    const $ = id => document.getElementById(id);
    const dropzone = $('dropzone');
    const fileInput = $('file-input');
    const statusBar = $('status-bar');
    const statusMsg = $('status-msg');
    const docInfo = $('doc-info');
    const summaryCards = $('summary-cards');
    const results = $('results');
    const resetBtn = $('reset-btn');
    const progressTrack = $('progress-track');
    const progressFill = $('progress-fill');
    const resultActions = $('result-actions');
    const downloadResultsBtn = $('download-results-btn');
    const zoteroFuzzyMatch = $('zotero-fuzzy-match');

    const ZOTERO_CONFIG = Object.freeze({
      groupId: '6640399', apiVersion: '3', minimumScore: 45,
      maximumCandidates: 5, searchResultLimit: 15,
      searchTimeoutMilliseconds: 30000,
      maximumOrphanLookups: 5, maximumUncitedLookups: 5
    });

    let currentReport = null;
    let currentRefEntries = [];
    let currentFilename = '';
    const activeInlineZoteroSearches = new Map();
    const zoteroSearchCache = new Map();

    dropzone.addEventListener('dragover', event => { event.preventDefault(); dropzone.classList.add('drag-over'); });
    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag-over'));
    dropzone.addEventListener('drop', event => { event.preventDefault(); dropzone.classList.remove('drag-over'); if (event.dataTransfer.files[0]) handleFile(event.dataTransfer.files[0]); });
    dropzone.addEventListener('click', event => { if (!event.target.closest('button') && event.target !== fileInput) fileInput.click(); });
    $('choose-file-btn').addEventListener('click', event => { event.stopPropagation(); fileInput.click(); });
    fileInput.addEventListener('change', () => { if (fileInput.files[0]) handleFile(fileInput.files[0]); });
    resetBtn.addEventListener('click', resetUI);
    downloadResultsBtn.addEventListener('click', downloadAnalysisReport);
    results.addEventListener('click', handleInlineZoteroClick);

    function showStatus(message) { statusMsg.textContent = message; statusBar.classList.add('show'); }
    function hideStatus() { statusBar.classList.remove('show'); }
    function setProgress(value, indeterminate = false) {
      progressTrack.classList.add('show');
      progressTrack.classList.toggle('indeterminate', indeterminate);
      const safeValue = Math.max(0, Math.min(100, Number(value) || 0));
      progressFill.style.width = indeterminate ? '' : `${safeValue}%`;
      progressTrack.setAttribute('aria-valuenow', String(Math.round(safeValue)));
    }
    function hideProgress() {
      progressTrack.classList.remove('show', 'indeterminate');
      progressFill.style.width = '0%';
      progressTrack.setAttribute('aria-valuenow', '0');
    }
    function yieldToBrowser() { return new Promise(resolve => setTimeout(resolve, 0)); }
    function withTimeout(promise, milliseconds, message) {
      let timer;
      const timeout = new Promise((_, reject) => { timer = setTimeout(() => reject(new Error(message)), milliseconds); });
      return Promise.race([promise, timeout]).finally(() => clearTimeout(timer));
    }

    function resetUI() {
      for (const controller of activeInlineZoteroSearches.values()) controller.abort();
      activeInlineZoteroSearches.clear();
      dropzone.style.display = '';
      statusBar.classList.remove('show');
      docInfo.classList.remove('show');
      summaryCards.classList.remove('show');
      results.innerHTML = '';
      hideProgress();
      resultActions.classList.remove('show');
      resetBtn.classList.remove('show');
      fileInput.value = '';
      currentReport = null;
      currentRefEntries = [];
      currentFilename = '';
    }

    async function handleFile(file) {
      if (!file.name.toLowerCase().endsWith('.docx')) {
        alert('Please upload a .docx file.');
        return;
      }
      dropzone.style.display = 'none';
      currentFilename = file.name;
      setProgress(5);
      showStatus('Reading file…');
      try {
        const zip = await JSZip.loadAsync(await file.arrayBuffer());
        setProgress(15);
        showStatus('Unzipping .docx…');
        const docXml = await zip.file('word/document.xml')?.async('string');
        if (!docXml) throw new Error('word/document.xml not found — is this a valid .docx?');
        setProgress(30);
        showStatus('Parsing document…');
        await yieldToBrowser();
        const { paragraphs, isSwedish } = parseDocXml(docXml);
        setProgress(45);
        showStatus('Finding reference list…');
        await yieldToBrowser();
        const { refListParagraphs, bodyParagraphs, refListStart } = splitAtRefList(paragraphs);
        setProgress(58);
        showStatus('Extracting references…');
        await yieldToBrowser();
        const refEntries = extractRefEntries(refListParagraphs);
        setProgress(70);
        showStatus('Finding in-text citations…');
        await yieldToBrowser();
        const inTextCites = findInTextCites(bodyParagraphs, refEntries);
        setProgress(82);
        showStatus('Cross-referencing…');
        await yieldToBrowser();
        const report = crossReference(refEntries, inTextCites);
        currentReport = report;
        currentRefEntries = refEntries;
        setProgress(92);
        showStatus('Checking SKB format rules…');
        await yieldToBrowser();
        const formatIssues = checkSkbFormat(refEntries);
        for (const duplicates of report.duplicateKeys) {
          for (const entry of duplicates) {
            formatIssues.push({
              key: entry.key,
              issue: `Duplicate key in reference list — ${duplicates.length} entries share the same key`,
              severity: 'error'
            });
          }
        }
        setProgress(100);
        hideStatus();
        setTimeout(hideProgress, 450);
        renderResults(file.name, refEntries, inTextCites, report, formatIssues, paragraphs.length, refListStart, isSwedish);
      } catch (error) {
        hideStatus();
        hideProgress();
        results.innerHTML = `<div style="color:var(--color-kvot-accent);padding:16px;background:var(--bg-secondary);border:1px solid var(--color-kvot-accent);border-radius:8px"><strong>Error:</strong> ${escHtml(error.message)}</div>`;
        resetBtn.classList.add('show');
      }
    }

    function parseDocXml(xml) {
      const doc = new DOMParser().parseFromString(xml, 'application/xml');
      const NS = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main';
      let isSwedish = false;
      for (const node of [...doc.getElementsByTagNameNS(NS, 'lang')].slice(0, 40)) {
        if (/^sv/i.test(node.getAttribute('w:val') || '')) { isSwedish = true; break; }
      }
      const paragraphs = [...doc.getElementsByTagNameNS(NS, 'p')].map((node, index) => {
        const pPr = node.getElementsByTagNameNS(NS, 'pPr')[0];
        const styleNode = pPr?.getElementsByTagNameNS(NS, 'pStyle')[0];
        const numPr = pPr?.getElementsByTagNameNS(NS, 'numPr')[0];
        return {
          text: extractTextFromParagraph(node, NS).trim(),
          style: (styleNode?.getAttribute('w:val') || '').toLowerCase(),
          numId: numPr?.getElementsByTagNameNS(NS, 'numId')[0]?.getAttribute('w:val') || '',
          index
        };
      });
      let section = '';
      for (const paragraph of paragraphs) {
        if (headingLevel(paragraph.style) && paragraph.text) section = paragraph.text;
        paragraph.section = section;
      }
      return { paragraphs, isSwedish };
    }

    function extractTextFromParagraph(node, NS) {
      let text = '';
      const fields = [];
      (function walk(parent) {
        for (let child = parent.firstChild; child; child = child.nextSibling) {
          if (child.nodeType !== 1) continue;
          if (child.namespaceURI !== NS) { walk(child); continue; }
          if (child.localName === 'fldChar') {
            const type = child.getAttribute('w:fldCharType');
            if (type === 'begin') fields.push({ skip: false, result: false });
            else if (type === 'separate' && fields.length) fields.at(-1).result = true;
            else if (type === 'end' && fields.length) fields.pop();
          } else if (child.localName === 'instrText' && fields.length) {
            if (/^(SEQ|CAPTION|PAGE|NUMPAGES|REF\b|PAGEREF|STYLEREF|TOC|TC\b|XE\b|AUTONUMLGL|AUTONUM|MERGEFIELD)\b/i.test((child.textContent || '').trim())) fields.at(-1).skip = true;
          } else if (child.localName === 't') {
            if (!fields.some(field => field.result && field.skip)) text += child.textContent || '';
          } else walk(child);
        }
      })(node);
      return text;
    }

    const REF_HEADING_RE = /^\s*(?:\d[\d.]*\s+)?(?:references?|referenser|referenslista|litteratur|bibliography)\s*$/i;
    const INTERNAL_REF_HEADING_RE = /^\s*(?:References with abbreviated names|Other references)\s*[.:]?\s*$/i;

    function headingLevel(style) {
      const match = style.match(/^(?:heading|rubrik|överskrift|berschrift|titre|t[iî]tulo)\s*([1-6])$/) || style.match(/^([1-6])$/);
      return match ? Number(match[1]) : 0;
    }

    function splitAtRefList(paragraphs) {
      let start = paragraphs.findIndex((paragraph, index) =>
        (headingLevel(paragraph.style) || paragraph.style.includes('heading') || paragraph.style === 'title') &&
        REF_HEADING_RE.test(paragraph.text) &&
        paragraphs.slice(index + 1, index + 6).map(item => item.text).join(' ').length > 10
      );
      if (start < 0) return { refListParagraphs: [], bodyParagraphs: paragraphs, refListStart: -1 };
      let end = paragraphs.length;
      const endRe = /^\s*(?:\d[\d.]*\s+)?(?:appendix|appendices|bilaga|bilagor|annex|glossary|ordlista|index)\b/i;
      for (let index = start + 1; index < paragraphs.length; index++) {
        const paragraph = paragraphs[index];
        if (!paragraph.text || INTERNAL_REF_HEADING_RE.test(paragraph.text)) continue;
        if (headingLevel(paragraph.style) || endRe.test(paragraph.text)) { end = index; break; }
      }
      return {
        refListParagraphs: paragraphs.slice(start + 1, end),
        bodyParagraphs: [...paragraphs.slice(0, start), ...paragraphs.slice(end)],
        refListStart: start
      };
    }

    function extractAbbreviatedReferenceName(text) {
      const match = String(text).match(/^\s*(.+?)\s*,\s*((?:1[89]\d{2}|20\d{2})[a-z]?)\s*[.]/);
      return match && match[1].trim().length <= 200 ? match[1].replace(/\s+/g, ' ').trim() : null;
    }

    function extractRefEntries(paragraphs) {
      const entries = [];
      let current = null;
      let autoNum = 0;
      let abbreviated = false;
      const finish = () => { if (current) entries.push(current); current = null; };
      const create = (text, paragraph) => {
        const abbreviatedName = abbreviated ? extractAbbreviatedReferenceName(text) : null;
        const reportKey = extractSkbReportKey(text, true);
        return {
          key: abbreviatedName || extractReferenceKey(text) || text.slice(0, 40),
          num: null, body: text, raw: text, paraIndex: paragraph.index,
          type: abbreviatedName ? 'abbreviated-name' : reportKey ? 'skb-report' : 'author-year',
          abbreviatedName
        };
      };
      for (const paragraph of paragraphs) {
        const text = paragraph.text.trim();
        if (/^\s*References with abbreviated names\s*[.:]?\s*$/i.test(text)) { finish(); abbreviated = true; continue; }
        if (/^\s*Other references\s*[.:]?\s*$/i.test(text)) { finish(); abbreviated = false; continue; }
        if (!text) { finish(); continue; }
        const number = text.match(/^(?:\[(\d+)\]|(\d+)[.)\s]\s)/);
        if (number || (paragraph.numId && paragraph.numId !== '0')) {
          finish();
          autoNum = number ? Number(number[1] || number[2]) : autoNum + 1;
          const body = number ? text.replace(/^\[?\d+\]?[.)\s]+/, '').trim() : text;
          const abbreviatedName = abbreviated ? extractAbbreviatedReferenceName(body) : null;
          current = { key: `[${autoNum}]`, num: autoNum, body, raw: text, paraIndex: paragraph.index, type: abbreviatedName ? 'abbreviated-name' : 'numbered', abbreviatedName };
        } else if ((abbreviated && extractAbbreviatedReferenceName(text)) || (current && looksLikeRefStart(text))) {
          finish(); current = create(text, paragraph);
        } else if (current) {
          current.body += ` ${text}`;
          current.raw += ` ${text}`;
        } else current = create(text, paragraph);
      }
      finish();
      for (const entry of entries) entry.aliases = collectReferenceAliases(entry);
      return entries;
    }

    function looksLikeRefStart(text) { return Boolean(extractSkbReportKey(text, true) || extractAuthorYearKey(text)); }

    function extractAuthorYearKey(text) {
      const list = text.match(/^(.+),\s*((?:1[89]\d{2}|20\d{2})[a-z]?)\s*[.,]/);
      if (list) {
        const surnames = list[1].split(',').map(part => part.trim().split(/\s+/)).map(words => {
          let removed = false;
          while (words.length > 1 && isAuthorInitial(words.at(-1))) { words.pop(); removed = true; }
          return removed ? words.join(' ') : '';
        }).filter(Boolean);
        if (surnames.length === 1) return `${surnames[0]} ${list[2]}`;
        if (surnames.length === 2) return `${surnames[0]} and ${surnames[1]} ${list[2]}`;
        if (surnames.length > 2) return `${surnames[0]} et al. ${list[2]}`;
      }
      const simple = text.match(/^([A-ZÀ-ÖØ-Þ][A-Za-zÀ-ÖØ-Þà-öø-ÿ-]+(?:\s+(?:et\s+al\.?|m\.fl\.?))?(?:,\s*[A-ZÀ-ÖØ-Þ][A-Za-zÀ-ÖØ-Þà-öø-ÿ.]+)?)(?:,\s*|\s+)((?:1[89]\d{2}|20\d{2})[a-z]?)/);
      return simple ? `${simple[1]} ${simple[2]}` : null;
    }

    function isAuthorInitial(value) {
      const clean = String(value).replace(/\./g, '');
      return clean.split('-').every(part => /^[A-ZÀ-ÖØ-Þ]{1,3}$/.test(part));
    }

    function normaliseDashes(text) { return String(text).replace(/[\u2010\u2011\u2012\u2013\u2014\u2212]/g, '-'); }

    function extractSkbReportKey(text, startOnly = false) {
      const normalized = normaliseDashes(text).replace(/\s+/g, ' ').trim();
      const prefix = startOnly ? '^\\s*(?:(?:\\[\\d+\\]|\\d+[.)])\\s*)?' : '(?:^|[^A-Za-z0-9])';
      const match = normalized.match(new RegExp(prefix + '(?:SKB[\\s-]*)?((?:TR|R|P|IPR|RD|SR|TM|U|F)-\\d{2,}-\\d+)(?=$|[^A-Za-z0-9])', 'i'));
      return match ? `SKB ${match[1].toUpperCase()}` : null;
    }

    function extractReferenceKey(text) { return extractSkbReportKey(text, true) || extractAuthorYearKey(text); }
    function collectReferenceAliases(entry) {
      return [...new Set([entry.key, entry.abbreviatedName, extractAuthorYearKey(entry.body), extractSkbReportKey(entry.body, true), extractSkbReportKey(entry.body)])].filter(Boolean);
    }

    function findInTextCites(paragraphs, entries) {
      const citations = [];
      const abbreviations = entries.filter(entry => entry.abbreviatedName).map(entry => entry.abbreviatedName).sort((a, b) => b.length - a.length);
      for (const paragraph of paragraphs) {
        if (!paragraph.text) continue;
        findAuthorYearCitations(paragraph, citations);
        findSkbCitations(paragraph, citations);
        for (const name of abbreviations) {
          const regex = new RegExp(`(?:^|[^A-Za-zÀ-ÖØ-Þà-öø-ÿ0-9])(${escapeRegExp(name).replace(/\\s+/g, '\\\\s+')})(?=$|[^A-Za-zÀ-ÖØ-Þà-öø-ÿ0-9])`, 'gi');
          let match;
          while ((match = regex.exec(paragraph.text))) citations.push({ key: name, raw: match[1], paraIndex: paragraph.index, section: paragraph.section, paraText: paragraph.text, type: 'abbreviated-name', author: name, year: null });
        }
      }
      const seen = new Set();
      return citations.filter(citation => {
        const id = `${normaliseKey(citation.key)}|${citation.paraIndex}`;
        if (seen.has(id)) return false;
        seen.add(id); return true;
      });
    }

    function findAuthorYearCitations(paragraph, out) {
      const year = '(?:1[89]\\d{2}|20\\d{2})[a-z]?';
      const surname = '(?:(?:van|von|de|del|della|der|den|di|da|dos|du|la|le|af)\\s+)*[A-ZÀ-ÖØ-Þ][A-Za-zÀ-ÖØ-Þà-öø-ÿ-]+';
      const author = `(?:[A-ZÅÄÖ]{2,}|${surname})(?:\\s+(?:et\\s+al\\.?|m\\.fl\\.?))?(?:\\s+(?:and|och|&)\\s+(?:[A-ZÅÄÖ]{2,}|${surname}))?`;
      for (const group of paragraph.text.matchAll(/\(([^()]*)\)/g)) {
        let previous = null;
        for (const part of group[1].split(/\s*[,;]\s*/).map(item => item.trim()).filter(Boolean)) {
          const match = part.match(new RegExp(`(?:^|[^A-Za-zÀ-ÖØ-Þà-öø-ÿ])(${author})\\s+(${year})(?=$|[^A-Za-zÀ-ÖØ-Þà-öø-ÿ0-9])`));
          if (match) {
            const normalizedAuthor = normaliseCitationAuthor(match[1]);
            previous = normalizedAuthor;
            if (normalizedAuthor.toUpperCase() !== 'SKB') out.push(makeCitation(`${normalizedAuthor} ${match[2]}`, paragraph, 'author-year', normalizedAuthor, match[2]));
          } else if (previous && new RegExp(`^${year}$`).test(part) && previous.toUpperCase() !== 'SKB') {
            out.push(makeCitation(`${previous} ${part}`, paragraph, 'author-year', previous, part));
          }
        }
      }
      const inline = new RegExp(`(?:^|[^A-Za-zÀ-ÖØ-Þà-öø-ÿ])(${author})\\s+\\((${year})(?:\\s*,\\s*[^()]*)?\\)`, 'g');
      let match;
      while ((match = inline.exec(paragraph.text))) {
        const normalizedAuthor = normaliseCitationAuthor(match[1]);
        if (normalizedAuthor.toUpperCase() !== 'SKB') out.push(makeCitation(`${normalizedAuthor} ${match[2]}`, paragraph, 'author-year', normalizedAuthor, match[2]));
      }
    }

    function findSkbCitations(paragraph, out) {
      const regex = /\bSKB\s+(?:\(((?:1[89]\d{2}|20\d{2})[a-z]?(?:[,\s]+(?:1[89]\d{2}|20\d{2})[a-z]?)*)\)|((?:1[89]\d{2}|20\d{2})[a-z]?)|((?:TR|R|P|IPR|RD|SR|TM|U|F)-\d{2,}-\d+))/gi;
      let match;
      while ((match = regex.exec(normaliseDashes(paragraph.text)))) {
        if (match[1]) for (const value of match[1].split(/\s*,\s*/)) out.push(makeCitation(`SKB ${value}`, paragraph, 'skb-year'));
        else if (match[2]) out.push(makeCitation(`SKB ${match[2]}`, paragraph, 'skb-year'));
        else out.push(makeCitation(`SKB ${match[3].toUpperCase()}`, paragraph, 'skb-report'));
      }
    }

    function makeCitation(key, paragraph, type, author = null, year = null) {
      return { key, raw: key, paraIndex: paragraph.index, section: paragraph.section, paraText: paragraph.text, type, author, year };
    }
    function normaliseCitationAuthor(author) { return String(author).replace(/\s+/g, ' ').replace(/\bet\s+al\.?$/i, 'et al.').replace(/\bm\.fl\.?$/i, 'm.fl.').trim(); }
    function escapeRegExp(text) { return String(text).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
    function normaliseKey(key) { return normaliseDashes(key).normalize('NFC').toLowerCase().replace(/et\s*al\.?/g, 'etal').replace(/\s*-\s*/g, '-').replace(/[\s.,;:!?\'"()\[\]{}]/g, ''); }

    function fuzzyMatch(first, second) {
      if (first.length < 4 || second.length < 4) return false;
      if (first.includes(second) || second.includes(first)) return true;
      const grams = value => new Set([...Array(Math.max(0, value.length - 1))].map((_, index) => value.slice(index, index + 2)));
      const left = grams(first), right = grams(second);
      return [...left].filter(gram => right.has(gram)).length / Math.max(left.size, right.size, 1) > .7;
    }

    function crossReference(entries, citations) {
      const byKey = new Map(), byAlias = new Map(), byNum = new Map();
      for (const entry of entries) {
        entry.cites = [];
        const key = normaliseKey(entry.key);
        (byKey.get(key) || byKey.set(key, []).get(key)).push(entry);
        for (const alias of entry.aliases || []) {
          const normalized = normaliseKey(alias);
          (byAlias.get(normalized) || byAlias.set(normalized, []).get(normalized)).push(entry);
        }
        if (entry.num !== null) byNum.set(entry.num, entry);
      }
      const orphanCites = [];
      for (const citation of citations) {
        let matches = [];
        if (citation.type === 'numbered' && byNum.has(citation.num)) matches = [byNum.get(citation.num)];
        else {
          const key = normaliseKey(citation.key);
          matches = byKey.get(key) || byAlias.get(key) || [];
          if (!matches.length) for (const [candidate, list] of byKey) if (fuzzyMatch(key, candidate)) { matches = list; break; }
        }
        if (matches.length) matches.forEach(entry => entry.cites.push(citation));
        else orphanCites.push(citation);
      }
      return { orphanCites, uncitedRefs: entries.filter(entry => !entry.cites.length), duplicateKeys: [...byKey.values()].filter(list => list.length > 1) };
    }

    const YEAR_RE = /\b(1[89]\d{2}|20\d{2})[a-z]?\b/;
    function checkSkbFormat(entries) {
      const issues = [];
      const numbered = entries.filter(entry => entry.num !== null).sort((a, b) => a.num - b.num);
      for (let index = 0; index < numbered.length - 1; index++) {
        if (numbered[index + 1].num - numbered[index].num > 1) issues.push({ key: numbered[index + 1].key, issue: `Numbering gap: expected [${numbered[index].num + 1}] before [${numbered[index + 1].num}]`, severity: 'warn' });
      }
      for (const entry of entries) {
        const text = entry.body;
        if (!YEAR_RE.test(text)) issues.push({ key: entry.key, issue: 'No year detected in reference', severity: 'warn' });
        if (text.length < 30) issues.push({ key: entry.key, issue: 'Entry seems too short — likely incomplete', severity: 'warn' });
        if (/^https?:\/\//.test(text)) issues.push({ key: entry.key, issue: 'URL-only reference; add author, title, and access date', severity: 'error' });
        if (/https?:\/\//.test(text) && !/(?:accessed|hämtad|hämtat|visited|retrieved|besökt)\s/i.test(text)) issues.push({ key: entry.key, issue: 'URL present but no access date', severity: 'warn' });
        const last = text.trim().slice(-1);
        if (text.length > 20 && !['.', ')'].includes(last)) issues.push({ key: entry.key, issue: `Reference does not end with a period (ends with "${last}")`, severity: 'info' });
      }
      return issues;
    }

    async function searchZoteroItems(
      query,
      { qmode = 'titleCreatorYear', limit = 15, timeoutMilliseconds = 30000, signal } = {}
    ) {
      const cleaned = String(query || '').replace(/\s+/g, ' ').trim();
      if (!cleaned) return [];

      const cacheKey = `${qmode}|${cleaned.toLowerCase()}`;
      if (zoteroSearchCache.has(cacheKey)) return zoteroSearchCache.get(cacheKey);

      const parameters = new URLSearchParams({
        format: 'json', include: 'data', q: cleaned, qmode,
        itemType: '-attachment', limit: String(limit)
      });
      const timeoutController = new AbortController();
      const abortFromCaller = () => timeoutController.abort();
      signal?.addEventListener('abort', abortFromCaller, { once: true });
      const timer = setTimeout(() => timeoutController.abort(), timeoutMilliseconds);

      try {
        const response = await fetch(
          `https://api.zotero.org/groups/${ZOTERO_CONFIG.groupId}/items/top?${parameters}`,
          {
            headers: {
              'Zotero-API-Version': ZOTERO_CONFIG.apiVersion,
              Accept: 'application/json'
            },
            signal: timeoutController.signal
          }
        );
        if (!response.ok) throw new Error(`Zotero API returned HTTP ${response.status}`);
        const returned = await response.json();
        if (!Array.isArray(returned)) throw new Error('Zotero returned an unexpected response.');
        const items = returned.filter(item => !['attachment', 'note', 'annotation'].includes(item?.data?.itemType));
        zoteroSearchCache.set(cacheKey, items);
        return items;
      } finally {
        clearTimeout(timer);
        signal?.removeEventListener('abort', abortFromCaller);
      }
    }

    function buildZoteroQueriesForCitation(citation){ const key=String(citation.key||'').trim(); if(!key)return[]; if(citation.type==='skb-report')return[{query:key.replace(/^SKB\s+/i,''),qmode:'everything'}]; const simple=key.replace(/\bet\s+al\.?|\bm\.fl\.?/gi,'').replace(/(?:\band\b|\boch\b|&)/gi,' ').replace(/\s+/g,' ').trim(); return dedupeQueries([{query:simple,qmode:'titleCreatorYear'}]); }
    function buildZoteroQueriesForReference(entry){ const title=getDocumentReferenceTitle(entry).split(/\s+/).filter(Boolean).slice(0,12).join(' '); const report=getDocumentReferenceReportKey(entry); const key=String(entry.key||'').replace(/\bet\s+al\.?|\bm\.fl\.?/gi,'').replace(/(?:\band\b|\boch\b|&)/gi,' ').replace(/\s+/g,' ').trim(); return dedupeQueries([{query:title,qmode:'titleCreatorYear'},{query:report?.replace(/^SKB\s+/i,''),qmode:'everything'},{query:key,qmode:'titleCreatorYear'}]); }
    function dedupeQueries(queries){ const seen=new Set(); return queries.filter(item=>{ if(!item.query)return false; const key=`${item.qmode}|${item.query.toLowerCase()}`; if(seen.has(key))return false; seen.add(key); return true; }); }
    function buildZoteroQueriesForFullReference(entry) {
      const queries = [];
      const reportKey = getDocumentReferenceReportKey(entry);
      const title = getDocumentReferenceTitle(entry);
      const authorYear = extractAuthorYearKey(entry.body) || entry.key || '';
      const year = getDocumentReferenceYear(entry) || '';
      const firstAuthor = extractFirstAuthorSurname(entry.body, authorYear);

      // Identifier query: strongest when Zotero quick search indexes the field.
      if (reportKey) {
        queries.push({
          query: reportKey.replace(/^SKB\s+/i, ''),
          qmode: 'everything'
        });
      }

      // Normalize punctuation and dash variants before title quick search.
      const normalizedTitle = normaliseTitle(title);
      if (normalizedTitle) {
        queries.push({ query: normalizedTitle, qmode: 'titleCreatorYear' });
      }

      // Short creator/year searches are more robust than one long combined query.
      if (firstAuthor && year) {
        queries.push({ query: `${firstAuthor} ${year}`, qmode: 'titleCreatorYear' });
      }
      if (firstAuthor) {
        queries.push({ query: firstAuthor, qmode: 'titleCreatorYear' });
      }
      if (authorYear) {
        queries.push({ query: authorYear, qmode: 'titleCreatorYear' });
      }

      return dedupeQueries(queries);
    }

    function extractFirstAuthorSurname(referenceText, authorYearKey = '') {
      const commaMatch = String(referenceText).match(/^\s*([^,]+),/);
      if (commaMatch) {
        const words = commaMatch[1].trim().split(/\s+/);
        while (words.length > 1 && isAuthorInitial(words.at(-1))) words.pop();
        if (words.length) return words.join(' ');
      }
      return String(authorYearKey)
        .replace(/\bet\s+al\.?/gi, '')
        .replace(/\bm\.fl\.?/gi, '')
        .replace(/\s+(?:1[89]\d{2}|20\d{2})[a-z]?.*$/i, '')
        .trim()
        .split(/\s+(?:and|och|&)\s+/i)[0]
        .trim();
    }

    async function findZoteroCandidates(queries, source, scoreFunction, signal) {
      const candidates = new Map();
      for (const search of queries) {
        if (signal.aborted) throw new DOMException('Search canceled', 'AbortError');
        let items = [];
        try {
          items = await searchZoteroItems(search.query, {
            qmode: search.qmode,
            limit: ZOTERO_CONFIG.searchResultLimit,
            timeoutMilliseconds: ZOTERO_CONFIG.searchTimeoutMilliseconds,
            signal
          });
        } catch (error) {
          if (error.name === 'AbortError') throw error;
          console.warn('Zotero query failed:', search.query, error);
          continue;
        }
        for (const candidate of prepareZoteroItems(items)) {
          const scored = scoreFunction(source, candidate);
          const existing = candidates.get(candidate.key);
          if (!existing || scored.score > existing.score) {
            candidates.set(candidate.key, { ...candidate, ...scored });
          }
        }
      }
      const minimumScore = zoteroFuzzyMatch.checked
        ? ZOTERO_CONFIG.minimumScore
        : 70;
      return [...candidates.values()]
        .filter(candidate => candidate.score >= minimumScore)
        .sort((a, b) => b.score - a.score)
        .slice(0, ZOTERO_CONFIG.maximumCandidates);
    }

    function handleInlineZoteroClick(event) {
      const button = event.target.closest('.zotero-row-btn');
      if (!button) return;
      const searchId = button.dataset.searchId;
      if (activeInlineZoteroSearches.has(searchId)) {
        activeInlineZoteroSearches.get(searchId).abort();
        return;
      }
      if (button.dataset.kind === 'reference') {
        runReferenceZoteroSearch(Number(button.dataset.index), button);
      } else {
        runCitationZoteroSearch(Number(button.dataset.index), button);
      }
    }

    async function runReferenceZoteroSearch(index, button) {
      const entry = currentRefEntries[index];
      if (!entry) return;
      await runInlineZoteroSearch({
        source: entry,
        queries: buildZoteroQueriesForFullReference(entry),
        scorer: scoreDocumentReferenceAgainstZotero,
        button,
        emptyMessage: 'No probable Zotero match found for this reference.'
      });
    }

    async function runCitationZoteroSearch(index, button) {
      const citation = currentReport?.orphanCites?.[index];
      if (!citation) return;
      await runInlineZoteroSearch({
        source: citation,
        queries: buildZoteroQueriesForCitation(citation),
        scorer: scoreOrphanCitationAgainstZotero,
        button,
        emptyMessage: 'No probable Zotero match found for this citation key.'
      });
    }

    async function runInlineZoteroSearch({ source, queries, scorer, button, emptyMessage }) {
      const searchId = button.dataset.searchId;
      const resultContainer = $(button.dataset.resultId);
      const controller = new AbortController();
      activeInlineZoteroSearches.set(searchId, controller);
      button.classList.add('searching');
      button.textContent = 'Cancel search';
      const modeLabel = zoteroFuzzyMatch.checked ? 'fuzzy matching enabled' : 'strict matching';
      resultContainer.innerHTML = `<div class="zotero-inline-status">Searching Zotero (${modeLabel})…</div>`;

      try {
        const candidates = await findZoteroCandidates(queries, source, scorer, controller.signal);
        resultContainer.innerHTML = candidates.length
          ? candidates.map(buildInlineZoteroCandidate).join('')
          : `<div class="zotero-inline-status">${escHtml(emptyMessage)}</div>`;
      } catch (error) {
        resultContainer.innerHTML = error.name === 'AbortError'
          ? '<div class="zotero-inline-status">Search canceled.</div>'
          : `<div class="zotero-inline-status">Search failed: ${escHtml(error.message)}</div>`;
      } finally {
        activeInlineZoteroSearches.delete(searchId);
        button.classList.remove('searching');
        button.textContent = 'Check Zotero';
      }
    }

    function buildInlineZoteroCandidate(candidate) {
      return `
        <div class="zotero-candidate">
          <div class="zotero-candidate-head">
            <div class="zotero-candidate-title">${escHtml(candidate.title || '(untitled Zotero item)')}</div>
            <span class="zotero-probability">${candidate.score}%</span>
          </div>
          <div>${escHtml(candidate.authors.join(', ') || 'No creator recorded')} · ${escHtml(candidate.year || 'No year')}</div>
          ${candidate.reportKey ? `<div>Report Number: ${escHtml(candidate.reportKey)}</div>` : ''}
          <div>Match basis: ${escHtml(candidate.reasons.join(', ') || 'metadata similarity')}</div>
          <a href="${escHtml(candidate.url)}" target="_blank" rel="noopener noreferrer">Open Zotero record ↗</a>
        </div>`;
    }

    function getZoteroYear(item){return String(item?.data?.date||'').match(/\b(?:1[89]\d{2}|20\d{2})[a-z]?\b/i)?.[0]||null;}
    function getZoteroAuthors(item){return (item?.data?.creators||[]).filter(c=>['author','bookAuthor','reporter','inventor','programmer'].includes(c.creatorType)).map(c=>String(c.lastName||c.name||'').trim()).filter(Boolean);}
    function getZoteroReportNumber(item){return String(item?.data?.reportNumber||'').trim();}
    function getZoteroSkbReportKey(item){return extractSkbReportKey(getZoteroReportNumber(item));}
    function getZoteroAuthorYearKey(item){const a=getZoteroAuthors(item),y=getZoteroYear(item);return !a.length||!y?null:a.length===1?`${a[0]} ${y}`:a.length===2?`${a[0]} and ${a[1]} ${y}`:`${a[0]} et al. ${y}`;}
    function prepareZoteroItems(items){return items.map(item=>{const aliases=[getZoteroAuthorYearKey(item),getZoteroSkbReportKey(item),item.data?.shortTitle].filter(Boolean);return{key:item.key,title:String(item.data?.title||''),year:getZoteroYear(item),authors:getZoteroAuthors(item),reportKey:getZoteroSkbReportKey(item),aliases,normalizedAliases:aliases.map(normaliseKey),url:item.links?.alternate?.href||`https://www.zotero.org/groups/${ZOTERO_CONFIG.groupId}/items/${item.key}`};});}
    function normaliseTitle(value) {
      return normaliseDashes(value || '')
        .normalize('NFC')
        .toLowerCase()
        .replace(/&/g, ' and ')
        .replace(/[^a-zà-öø-ÿ0-9]+/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function titleSimilarity(firstValue, secondValue) {
      const first = new Set(normaliseTitle(firstValue).split(' ').filter(word => word.length >= 2));
      const second = new Set(normaliseTitle(secondValue).split(' ').filter(word => word.length >= 2));
      if (!first.size || !second.size) return 0;
      const common = [...first].filter(word => second.has(word)).length;
      return common / (first.size + second.size - common);
    }

    function stringSimilarity(firstValue, secondValue) {
      const first = normaliseTitle(firstValue).replace(/\s+/g, '');
      const second = normaliseTitle(secondValue).replace(/\s+/g, '');
      if (!first || !second) return 0;
      if (first === second) return 1;
      const bigrams = value => {
        const result = new Map();
        for (let index = 0; index < value.length - 1; index++) {
          const gram = value.slice(index, index + 2);
          result.set(gram, (result.get(gram) || 0) + 1);
        }
        return result;
      };
      const left = bigrams(first);
      const right = bigrams(second);
      let intersection = 0;
      for (const [gram, count] of left) {
        intersection += Math.min(count, right.get(gram) || 0);
      }
      return (2 * intersection) / Math.max(1, first.length + second.length - 2);
    }

    function getDocumentReferenceTitle(entry) {
      return String(entry.body || '')
        .replace(/^\s*SKB\s+(?:TR|R|P|IPR|RD|SR|TM|U|F)-\d{2,}-\d+\s*[.,]?\s*/i, '')
        .replace(/^.+?,\s*(?:1[89]\d{2}|20\d{2})[a-z]?\s*[.]\s*/, '')
        .replace(/^.+?\s+(?:1[89]\d{2}|20\d{2})[a-z]?\s*[.]\s*/, '')
        .split(/\.\s+/)[0]
        .trim();
    }

    function getDocumentReferenceYear(entry) {
      return String(entry.body || '').match(/\b(?:1[89]\d{2}|20\d{2})[a-z]?\b/i)?.[0] || null;
    }

    function getDocumentReferenceReportKey(entry) {
      return extractSkbReportKey(entry.body || '');
    }

    function scoreOrphanCitationAgainstZotero(citation, candidate) {
      let score = 0;
      const reasons = [];
      const citationKey = normaliseKey(citation.key);
      if (candidate.normalizedAliases.includes(citationKey)) {
        score += 90;
        reasons.push('exact citation alias');
      }
      if (citation.type === 'skb-report' && candidate.reportKey && normaliseKey(candidate.reportKey) === citationKey) {
        score = Math.max(score, 98);
        reasons.push('exact SKB report number');
      }
      const year = citation.year || String(citation.key).match(/\b(?:1[89]\d{2}|20\d{2})[a-z]?\b/i)?.[0];
      if (year && candidate.year && year.toLowerCase() === candidate.year.toLowerCase()) {
        score += 10;
        reasons.push('same year');
      }
      if (citation.author && candidate.authors.length) {
        const citedAuthor = citation.author.replace(/\s+(?:et\s+al\.?|m\.fl\.?).*$/i, '').split(/\s+(?:and|och|&)\s+/i)[0];
        const similarity = stringSimilarity(citedAuthor, candidate.authors[0]);
        if (similarity >= .9) { score += 25; reasons.push('same first author'); }
        else if (zoteroFuzzyMatch.checked && similarity >= .72) { score += 15; reasons.push('similar first author'); }
      }
      return { score: Math.min(score, 100), reasons };
    }

    function scoreDocumentReferenceAgainstZotero(entry, candidate) {
      let score = 0;
      const reasons = [];
      const aliases = new Set((entry.aliases || [entry.key]).map(normaliseKey));

      if (candidate.normalizedAliases.some(alias => aliases.has(alias))) {
        score += 65;
        reasons.push('exact reference alias');
      }

      const documentReport = getDocumentReferenceReportKey(entry);
      if (documentReport && candidate.reportKey && normaliseKey(documentReport) === normaliseKey(candidate.reportKey)) {
        score += 75;
        reasons.push('exact SKB report number');
      }

      const documentYear = getDocumentReferenceYear(entry);
      if (documentYear && candidate.year && documentYear.toLowerCase() === candidate.year.toLowerCase()) {
        score += 10;
        reasons.push('same year');
      }

      const documentTitle = getDocumentReferenceTitle(entry);
      const titleScore = titleSimilarity(documentTitle, candidate.title);
      if (titleScore >= .9) { score += 45; reasons.push('near-exact title'); }
      else if (titleScore >= .75) { score += 38; reasons.push('very similar title'); }
      else if (titleScore >= .55) { score += 28; reasons.push('similar title'); }
      else if (zoteroFuzzyMatch.checked && titleScore >= .35) { score += 18; reasons.push('partly similar title'); }

      const documentFirstAuthor = extractFirstAuthorSurname(entry.body, extractAuthorYearKey(entry.body) || entry.key);
      if (documentFirstAuthor && candidate.authors.length) {
        const authorScore = stringSimilarity(documentFirstAuthor, candidate.authors[0]);
        if (authorScore >= .92) { score += 30; reasons.push('same first author'); }
        else if (zoteroFuzzyMatch.checked && authorScore >= .72) { score += 18; reasons.push('similar first author'); }
      }

      return { score: Math.min(score, 100), reasons };
    }

    function downloadAnalysisReport() {
      if (!results.innerHTML.trim()) return;
      const reportTitle = currentFilename
        ? `SKB Reference Checker — ${currentFilename}`
        : 'SKB Reference Checker report';
      const generated = new Date().toLocaleString();

      /*
        Create a clean copy of the analysis for export. The interactive
        Check Zotero buttons are useful on the live page, but should not
        appear in the downloaded report. Completed Zotero matches remain.
      */
      const exportedResults = results.cloneNode(true);
      exportedResults.querySelectorAll('.zotero-row-btn').forEach(button => {
        button.remove();
      });
      exportedResults.querySelectorAll('.zotero-inline-results:empty').forEach(container => {
        container.remove();
      });

      const reportHtml = `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>${escHtml(reportTitle)}</title>
<style>
body{max-width:1000px;margin:0 auto;padding:32px;font:15px/1.5 system-ui,sans-serif;color:#222}h1{font-size:1.5rem}small{color:#666}.result-section{margin:16px 0;border:1px solid #ccc;border-radius:8px}.result-section summary{padding:10px 14px;font-weight:700}.section-body{padding:14px}.section-badge{float:right}.ref-table{width:100%;border-collapse:collapse}.ref-table th,.ref-table td{padding:7px;border-bottom:1px solid #ddd;text-align:left;vertical-align:top}.ref-key,code{font-family:monospace}.tag{display:inline-block;margin:3px;padding:3px 8px;border:1px solid #d6a54a;border-radius:12px}a{color:#075fa8}
</style>
</head>
<body>
<h1>${escHtml(reportTitle)}</h1>
<p><small>Generated ${escHtml(generated)}</small></p>
${docInfo.innerHTML}
${exportedResults.innerHTML}
</body>
</html>`;
      const blob = new Blob([reportHtml], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      const baseName = (currentFilename || 'skb-reference-report').replace(/\.docx$/i, '').replace(/[^a-z0-9_-]+/gi, '-');
      link.href = url;
      link.download = `${baseName}-analysis.html`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    function renderResults(filename, entries, citations, report, issues, total, start, isSwedish) {
      docInfo.innerHTML = `<strong>${escHtml(filename)}</strong> ${isSwedish ? '🇸🇪 Svenska — ' : ''}${total} paragraphs · ${entries.length} reference list entries · ${citations.length} in-text citation occurrences · ${start >= 0 ? `Reference list found at paragraph ${start + 1}.` : 'No reference list section detected.'}`;
      docInfo.classList.add('show');
      const cited = entries.filter(entry => entry.cites.length).length;
      setSummary('total', entries.length, entries.length ? 'ok' : 'warn');
      setSummary('cited', cited, cited === entries.length && entries.length ? 'ok' : cited ? '' : 'warn');
      setSummary('orphan', report.orphanCites.length, report.orphanCites.length ? 'warn' : 'ok');
      setSummary('issues', issues.length, issues.length ? 'warn' : 'ok');
      summaryCards.classList.add('show');
      resultActions.classList.add('show');
      results.innerHTML = buildRefListSection(entries) + buildOrphanSection(report.orphanCites) + buildUncitedSection(report.uncitedRefs) + buildFormatSection(issues, entries);
      resetBtn.classList.add('show');
    }

    function buildRefListSection(entries) {
      const rows = entries.length
        ? entries.map((entry, index) => {
            const sections = [...new Set(entry.cites.map(citation => citation.section).filter(Boolean))]
              .slice(0, 5).map(escHtml).join('<br>');
            return `
              <tr class="${entry.cites.length ? '' : 'warn-row'}">
                <td><span class="ref-key">${escHtml(entry.key)}</span></td>
                <td class="ref-text">${escHtml(entry.body)}</td>
                <td class="cite-count">${entry.cites.length}</td>
                <td class="cite-pages">${sections}</td>
                <td class="zotero-cell">
                  <button class="zotero-row-btn" type="button" data-kind="reference" data-index="${index}" data-search-id="reference-${index}" data-result-id="zotero-reference-${index}" title="Search Zotero using authors, publication year, and title extracted from this reference">Check Zotero</button>
                  <div id="zotero-reference-${index}" class="zotero-inline-results"></div>
                </td>
              </tr>`;
          }).join('')
        : '<tr><td colspan="5" class="empty-notice">No reference list detected.</td></tr>';
      return section(
        'Reference list entries',
        entries.length,
        `<table class="ref-table"><thead><tr><th>Key</th><th>Reference text</th><th>Cited (#)</th><th>In section(s)</th><th>Zotero</th></tr></thead><tbody>${rows}</tbody></table>`,
        true
      );
    }

    function buildOrphanSection(items) {
      const body = items.length
        ? `<table class="ref-table"><thead><tr><th>Citation</th><th>Context</th><th>Section</th><th>Type</th><th>Zotero</th></tr></thead><tbody>${items.map((citation, index) => `
            <tr class="error-row">
              <td><span class="ref-key">${escHtml(citation.key)}</span></td>
              <td>${truncate(escHtml(citation.paraText), 100)}</td>
              <td>${escHtml(citation.section || '—')}</td>
              <td>${escHtml(citation.type)}</td>
              <td class="zotero-cell">
                <button class="zotero-row-btn" type="button" data-kind="citation" data-index="${index}" data-search-id="citation-${index}" data-result-id="zotero-citation-${index}" title="Search Zotero using this citation key">Check Zotero</button>
                <div id="zotero-citation-${index}" class="zotero-inline-results"></div>
              </td>
            </tr>`).join('')}</tbody></table>`
        : '<p class="empty-notice">All in-text citations match a reference list entry.</p>';
      return section('In-text citations with no matching reference list entry', items.length, body, items.length > 0);
    }

    function buildUncitedSection(items){const body=items.length?`<div class="tag-list">${items.map(e=>`<div class="tag warn-tag">⚠ <code>${escHtml(e.key)}</code></div>`).join('')}</div>`:'<p class="empty-notice">Every reference in the list is cited at least once.</p>';return section('Reference list entries never cited in text',items.length,body);}
    function buildFormatSection(issues,entries){const map=new Map(entries.map(e=>[e.key,e.body]));const groups=new Map();issues.forEach(i=>(groups.get(i.key)||groups.set(i.key,[]).get(i.key)).push(i));const body=issues.length?`<table class="ref-table"><thead><tr><th>Key</th><th>Reference text</th><th>Issues</th></tr></thead><tbody>${[...groups].map(([key,list])=>`<tr><td><span class="ref-key">${escHtml(key)}</span></td><td>${truncate(escHtml(map.get(key)||''),100)}</td><td><ul class="issue-list">${list.map(i=>`<li>[${i.severity.toUpperCase()}] ${escHtml(i.issue)}</li>`).join('')}</ul></td></tr>`).join('')}</tbody></table>`:'<p class="empty-notice">No SKB format rule violations detected.</p>';return section('SKB format rule issues',issues.length,body);}
    function section(title,count,body,open=false){const good=!count||count==='unavailable';return `<details class="result-section" ${open?'open':''}><summary>${title}<span class="section-badge ${good?'good':'warn'}">${count===0?'✓ none':count}</span></summary><div class="section-body">${body}</div></details>`;}
    function setSummary(name,value,state){$(`cnt-${name}`).textContent=value;const card=$(`card-${name}`);card.classList.remove('warn','ok');if(state)card.classList.add(state);}
    function escHtml(value){return String(value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
    function truncate(value,length){return value.length>length?`${value.slice(0,length)}…`:value;}
  </script>
</body>
</html>
