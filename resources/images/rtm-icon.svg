<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img">
	<title>Reactive Transport</title>
	<!--
		A column through which water has flowed and dissolved the mineral it
		held, from the inlet up to a front: behind the front the column is
		bare and low, ahead of it the mineral is still there. The front, the
		shaded riser between the two, is what the page is about: where a
		reaction has got to, carried along by the water.

		DRAWN IN THE KVOTAB MARK'S LANGUAGE, the same four rules as
		kompartment/icon.svg and the other pages' icons: true 30-degree
		isometric (every edge horizontal, at +/-30 degrees or vertical); one
		flat tone per face, #f3b87b on top, #bb6c5d on the right, #344126 on
		the left; no strokes; no background plate.

		The column is its outline in the upright plane along its length,
		extruded across its width: the inlet nearest the viewer on the left,
		the outlet rising to the right, as the flow runs on the page's charts.

		Generated by scripts/gen-rtm-icon.py, not typed. Change the inputs
		there and run it again rather than editing the numbers here.
	-->

	<!-- the column -->
	<polygon fill="#f3b87b" points="61,12.54 34.35,27.93 23.38,21.59 50.03,6.21"/>
	<polygon fill="#344126" points="34.35,27.93 34.35,40.6 23.38,34.26 23.38,21.59"/>
	<polygon fill="#f3b87b" points="34.35,40.6 13.97,52.36 3,46.03 23.38,34.26"/>
	<polygon fill="#344126" points="13.97,52.36 13.97,57.79 3,51.46 3,46.03"/>
	<polygon fill="#bb6c5d" points="13.97,57.79 61,30.64 61,12.54 34.35,27.93 34.35,40.6 13.97,52.36"/>
</svg>
