<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img">
	<title>Glosor</title>
	<!--
		A pile of three word cards, the top one with three lines of writing:
		Glosor's cards, with this week's words on them.

		DRAWN IN THE KVOTAB MARK'S LANGUAGE, the same four rules as
		kompartment/icon.svg and the other pages' icons: true 30-degree
		isometric (every edge horizontal, at +/-30 degrees or vertical); one
		flat tone per face, #f3b87b on top, #bb6c5d on the right, #344126 on
		the left; no strokes; no background plate.

		Each card is a box, a little out of line with the one under it so
		that the pile shows as cards, not as one block. The lines of writing
		are low bars on the top card: their tops are lit like the card, so
		what shows of them is their two dark faces, as strokes. They are a
		pixel apart at thirty-two pixels; at sixteen, the pile is a light
		tile with dark edges, which is all a tab has room for.

		Generated by scripts/gen-flashcards-icon.py, not typed. Change the
		inputs there and run it again rather than editing the numbers here.
	-->

