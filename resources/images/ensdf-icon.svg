<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img">
	<title>Chart of Nuclides (ENSDF)</title>
	<!--
		The radiation trefoil, cut from a cube.

		DRAWN IN THE KVOTAB MARK'S LANGUAGE, the same four rules as
		kompartment/icon.svg: true 30-degree isometric (every edge
		horizontal, at +/-30 degrees or vertical); one flat tone per face,
		#f3b87b on top, #bb6c5d on the right, #344126 on the left; no
		strokes; no background plate.

		The first rule decides the trefoil. A cube seen corner on is a
		hexagon cut into six 60-degree triangles by the three edges and the
		three face diagonals that meet at the corner, and every one of those
		lines is an allowed one; three alternate triangles are a trefoil,
		one blade on each face, so each takes that face's tone. The usual
		sign has its blades' sides at 0, 60 and 120 degrees, which the rule
		does not allow, so this one is the sign turned by 30 degrees.

		The blades are plates rather than paper: each shows its two edges
		that face the viewer in the other two tones, which keeps every blade
		in sight on a light tab and on a dark one. The core is a small cube
		in the corner they were cut from. Every gap between the pieces is
		more than a pixel at sixteen pixels, which is what keeps the four
		apart in a browser tab.

		Generated by scripts/gen-ensdf-icon.py, not typed: the cube, the
		cut, the plates' thickness and the core, scaled into the square and
		rounded to two places. Change the inputs there and run it again
		rather than editing the numbers here.
	-->

	<!-- the blades: half the top, half the right face, half the left face -->
	<polygon fill="#f3b87b" points="18.36,24.12 4.72,16.25 32,0.5 32,16.25"/>
	<polygon fill="#344126" points="18.36,24.12 4.72,16.25 4.72,20.03 18.36,27.91"/>
	<polygon fill="#bb6c5d" points="18.36,24.12 32,16.25 32,20.03 18.36,27.91"/>
	<polygon fill="#bb6c5d" points="45.64,24.12 59.28,16.25 59.28,47.75 45.64,39.88"/>
	<polygon fill="#f3b87b" points="45.64,24.12 59.28,16.25 56.01,14.36 42.37,22.23"/>
	<polygon fill="#344126" points="45.64,24.12 45.64,39.88 42.37,37.98 42.37,22.23"/>
	<polygon fill="#344126" points="32,47.75 32,63.5 4.72,47.75 18.36,39.88"/>
	<polygon fill="#bb6c5d" points="32,47.75 32,63.5 35.27,61.61 35.27,45.86"/>
	<polygon fill="#f3b87b" points="32,47.75 18.36,39.88 21.63,37.98 35.27,45.86"/>

	<!-- the core, in the corner they were cut from -->
	<polygon fill="#344126" points="26.36,28.75 32,32 32,38.51 26.36,35.26"/>
	<polygon fill="#bb6c5d" points="32,32 37.64,28.75 37.64,35.26 32,38.51"/>
	<polygon fill="#f3b87b" points="26.36,28.75 32,25.49 37.64,28.75 32,32"/>
</svg>
