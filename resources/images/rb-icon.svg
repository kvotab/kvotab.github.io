<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img">
	<title>HDF5 Browser</title>
	<!--
		The H of the HDF Group's mark, cut through its crossbar: the first
		letter of the format whose files this page opens.

		The HDF Group draws H, D and F as one ligature of heavy strokes, with
		a crossbar on the H as thick as two of them, and cuts the whole of it
		through the middle, the upper half blue and the lower green. Here the
		H alone keeps that cut: its upper half is a U over its lower half,
		an upside-down U, and the cut runs between them through the middle
		of the crossbar. It is redrawn, not copied: no blue or green, no D
		or F, only the letter and the cut.

		DRAWN IN THE KVOTAB MARK'S LANGUAGE, the same four rules as
		kompartment/icon.svg and smui-icon.svg: true 30-degree isometric
		(every edge horizontal, at +/-30 degrees or vertical); one flat tone
		per face, #f3b87b on top, #bb6c5d on the right, #344126 on the left;
		no strokes; no background plate.

		Each half is its outline in one vertical plane, extruded towards the
		viewer as far as a stem is wide, so every bar is square in section,
		as the kvot mark's are. Through the cut the lower half's top shows in
		the lit tone, where the HDF mark shows white. The cut is just over a
		pixel across at sixteen pixels, which keeps the halves apart in a
		browser tab, and the stems stand on whole pixels: their outer edges at
		sixteen pixels, every upright edge at thirty-two.

		Generated by scripts/gen-rb-icon.py, not typed: the stem, the depth,
		the counter, the notch and the cut, laid on the pixel grid and rounded
		to two places. Change the inputs there and run it again rather than
		editing the numbers here.
	-->

	<!-- the lower half, an upside-down U -->
	<polygon fill="#344126" points="46,37.86 46,48.26 40,44.79 40,34.4"/>
	<polygon fill="#f3b87b" points="52,27.47 22,44.79 16,41.33 46,24.01"/>
	<polygon fill="#344126" points="22,44.79 22,62.11 16,58.65 16,41.33"/>
	<polygon fill="#bb6c5d" points="22,62.11 28,58.65 28,48.26 46,37.86 46,48.26 52,44.79 52,27.47 22,44.79"/>

	<!-- the upper half, a U above the cut -->
	<polygon fill="#344126" points="46,8.82 46,19.21 40,15.74 40,5.35"/>
	<polygon fill="#f3b87b" points="52,5.35 46,8.82 40,5.35 46,1.89"/>
	<polygon fill="#f3b87b" points="46,19.21 28,29.6 22,26.14 40,15.74"/>
	<polygon fill="#344126" points="22,22.67 22,39.99 16,36.53 16,19.21"/>
	<polygon fill="#f3b87b" points="28,19.21 22,22.67 16,19.21 22,15.74"/>
	<polygon fill="#bb6c5d" points="22,39.99 52,22.67 52,5.35 46,8.82 46,19.21 28,29.6 28,19.21 22,22.67"/>
</svg>
