<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img">
	<title>Svensk text</title>
	<!--
		Two lines of a subtitle: the most a subtitle may have, the upper one the
		shorter, as Swedish subtitling breaks them.

		DRAWN IN THE KVOTAB MARK'S LANGUAGE, the same four rules as
		kompartment/icon.svg and the other pages' icons: true 30-degree
		isometric (every edge horizontal, at +/-30 degrees or vertical); one
		flat tone per face, #f3b87b on top, #bb6c5d on the right, #344126 on
		the left; no strokes; no background plate.

		Each line is a bar in one upright plane, extruded towards the viewer,
		so its face is the right-hand tone and its top and left edges show in
		the other two, as the letters of the other icons do. The upper bar is
		centred over the lower one.

		Generated by scripts/gen-svensk_text-icon.py, not typed. Change the
		inputs there and run it again rather than editing the numbers here.
	-->

