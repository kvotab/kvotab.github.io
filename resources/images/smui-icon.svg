<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img">
	<title>User Interface for statsmodels</title>
	<!--
		A fitted curve with a data point on each side, and a dot over the top
		of the curve: statsmodels' mark and JMP's, met halfway.

		statsmodels draws a curve that climbs, runs across and climbs again,
		with its points on either side of it. JMP's wordmark is a lowercase
		j whose dot is a figure. Here the curve's upper end is a stem, and a
		cube set straight above it makes that end a dotted j, so the one bar
		is both the fit and the letter. Neither mark is copied: no blue, no
		figure, no round dots, only the arrangement.

		DRAWN IN THE KVOTAB MARK'S LANGUAGE, the same four rules as
		kompartment/icon.svg: true 30-degree isometric (every edge
		horizontal, at +/-30 degrees or vertical, so the curve is a bar with
		corners); one flat tone per face, #f3b87b on top, #bb6c5d on the
		right, #344126 on the left; no strokes; no background plate.

		The bar is a profile in one vertical plane, extruded towards the
		viewer, so its right face is the whole curve and the top and left
		faces are thin strips. It is thinner than the cubes, as statsmodels'
		curve is thinner than its dots. Every gap between pieces is just over
		a pixel at sixteen pixels, which is what keeps the four apart in a
		browser tab; the cubes are placed by that gap rather than by eye.

		Generated by scripts/gen-smui-icon.py, not typed: the bar's profile,
		three cubes and that one gap, scaled into the square and rounded to
		two places. Change the inputs there and run it again rather than
		editing the numbers here.
	-->

	<!-- the points, one on each side of the fit -->
	<polygon fill="#344126" points="7,25.33 15.98,30.52 15.98,40.88 7,35.7"/>
	<polygon fill="#bb6c5d" points="15.98,30.52 24.96,25.33 24.96,35.7 15.98,40.88"/>
	<polygon fill="#f3b87b" points="7,25.33 15.98,20.15 24.96,25.33 15.98,30.52"/>
	<polygon fill="#344126" points="39.04,47.95 48.02,53.13 48.02,63.5 39.04,58.32"/>
	<polygon fill="#bb6c5d" points="48.02,53.13 57,47.95 57,58.32 48.02,63.5"/>
	<polygon fill="#f3b87b" points="39.04,47.95 48.02,42.76 57,47.95 48.02,53.13"/>

	<!-- the fit: up, across and up again -->
	<polygon fill="#bb6c5d" points="21,60.9 25.9,58.07 25.9,50.53 45.49,39.22 45.49,26.02 40.59,28.85 40.59,36.39 21,47.7"/>
	<polygon fill="#f3b87b" points="45.49,26.02 40.59,28.85 36.51,26.5 41.41,23.67"/>
	<polygon fill="#344126" points="40.59,28.85 40.59,36.39 36.51,34.04 36.51,26.5"/>
	<polygon fill="#f3b87b" points="40.59,36.39 21,47.7 16.92,45.35 36.51,34.04"/>
	<polygon fill="#344126" points="21,47.7 21,60.9 16.92,58.54 16.92,45.35"/>

	<!-- the dot over its upper end -->
	<polygon fill="#344126" points="32.84,5.21 41,9.93 41,19.35 32.84,14.64"/>
	<polygon fill="#bb6c5d" points="41,9.93 49.16,5.21 49.16,14.64 41,19.35"/>
	<polygon fill="#f3b87b" points="32.84,5.21 41,0.5 49.16,5.21 41,9.93"/>
</svg>
