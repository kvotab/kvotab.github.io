<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img">
	<title>Pianoskolan</title>
	<!--
		Two eighth notes on one beam: a melody, which is what Pianoskolan
		teaches, a note at a time, and what it listens for.

		DRAWN IN THE KVOTAB MARK'S LANGUAGE, the same four rules as
		kompartment/icon.svg and the other pages' icons: true 30-degree
		isometric (every edge horizontal, at +/-30 degrees or vertical); one
		flat tone per face, #f3b87b on top, #bb6c5d on the right, #344126 on
		the left; no strokes; no background plate.

		The notes are their outline in one upright plane, extruded towards
		the viewer: two square heads, a stem rising from the right of each,
		and the beam across their tops. The plane runs to the right and back,
		so the heads lean as printed noteheads do and the beam rises to the
		right, as it does over two notes going up.

		A keyboard was drawn first and dropped: in this projection every top
		is lit, so the black keys show as light as the white ones, and at tab
		size the keys were a stepped slab.

		Generated by scripts/gen-piano-icon.py, not typed. Change the inputs
		there and run it again rather than editing the numbers here.
	-->

	<!-- the notes -->
	<polygon fill="#344126" points="40.41,38.75 40.41,48.22 34.25,44.66 34.25,35.19"/>
	<polygon fill="#f3b87b" points="48.2,34.25 40.41,38.75 34.25,35.19 42.04,30.7"/>
	<polygon fill="#344126" points="48.2,15.79 48.2,34.25 42.04,30.7 42.04,12.23"/>
	<polygon fill="#344126" points="18.27,51.53 18.27,61 12.11,57.45 12.11,47.98"/>
	<polygon fill="#f3b87b" points="26.06,47.03 18.27,51.53 12.11,47.98 19.9,43.48"/>
	<polygon fill="#f3b87b" points="51.89,6.55 26.06,21.47 19.9,17.91 45.73,3"/>
	<polygon fill="#344126" points="26.06,21.47 26.06,47.03 19.9,43.48 19.9,17.91"/>
	<polygon fill="#bb6c5d" points="18.27,61 29.75,54.37 29.75,26.44 48.2,15.79 48.2,34.25 40.41,38.75 40.41,48.22 51.89,41.59 51.89,6.55 26.06,21.47 26.06,47.03 18.27,51.53"/>
</svg>
