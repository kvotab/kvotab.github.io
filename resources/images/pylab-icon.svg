<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img">
	<title>pylab</title>
	<!--
		The prompt the Command Window waits at, two chevrons.

		DRAWN IN THE KVOTAB MARK'S LANGUAGE, the same four rules as
		kompartment/icon.svg and the other pages' icons: true 30-degree
		isometric (every edge horizontal, at +/-30 degrees or vertical); one
		flat tone per face, #f3b87b on top, #bb6c5d on the right, #344126 on
		the left; no strokes; no background plate.

		A chevron cannot be drawn upright: its arms would leave the three
		axes. Lying flat it can. An L-shaped slab whose arms run back along
		the two ground axes from a corner nearest the right shows on screen
		as a point with arms rising and falling at 30 degrees to the left,
		that is, as a chevron. Its top is the lit tone; the shaded edge under
		the upper arm and the right-hand face under the lower arm give it its
		thickness. The second chevron is the first moved to the right.

		Generated by scripts/gen-pylab-icon.py, not typed. Change the inputs
		there and run it again rather than editing the numbers here.
	-->

	<!-- the first chevron -->
	<polygon fill="#344126" points="3,27.69 14.6,34.39 14.6,29.61 3,22.91"/>
	<polygon fill="#bb6c5d" points="9.63,44.92 27.86,34.39 27.86,29.61 9.63,40.13"/>
	<polygon fill="#344126" points="3,41.09 9.63,44.92 9.63,40.13 3,36.31"/>
	<polygon fill="#f3b87b" points="3,22.91 14.6,29.61 3,36.31 9.63,40.13 27.86,29.61 9.63,19.08"/>

	<!-- the second -->
	<polygon fill="#344126" points="36.14,27.69 47.74,34.39 47.74,29.61 36.14,22.91"/>
	<polygon fill="#bb6c5d" points="42.77,44.92 61,34.39 61,29.61 42.77,40.13"/>
	<polygon fill="#344126" points="36.14,41.09 42.77,44.92 42.77,40.13 36.14,36.31"/>
	<polygon fill="#f3b87b" points="36.14,22.91 47.74,29.61 36.14,36.31 42.77,40.13 61,29.61 42.77,19.08"/>
</svg>
