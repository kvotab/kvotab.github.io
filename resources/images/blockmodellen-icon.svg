<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img">
	<title>Blockmodellen</title>
	<!--
		A block model of a comparison: two bars that begin at the same
		place, the short one above and the long one below, with a bit that
		sticks out, their difference. That bit is what the model shows at a
		glance, and what Blockmodellen teaches a pupil to draw, and to look
		for.

		DRAWN IN THE KVOTAB MARK'S LANGUAGE, the same four rules as
		kompartment/icon.svg and the other pages' icons: true 30-degree
		isometric (every edge horizontal, at +/-30 degrees or vertical); one
		flat tone per face, #f3b87b on top, #bb6c5d on the right, #344126 on
		the left; no strokes; no background plate.

		Each bit is a box in one upright plane, extruded towards the viewer:
		its face is the right-hand tone, as the letters of the other icons
		are, its top the lit tone. The extra bit's shaded side parts it from
		the bit before it, as the line between two bits does on paper.

		Long thin bars were drawn first and dropped: at tab size they were
		two sticks. Short thick ones fill the square and stay blocks.

		Generated by scripts/gen-blockmodellen-icon.py, not typed. Change the
		inputs there and run it again rather than editing the numbers here.
	-->

	<!-- the bars -->
	<polygon fill="#344126" points="9.07,30.46 16.56,34.79 16.56,19.81 9.07,15.48"/>
	<polygon fill="#bb6c5d" points="16.56,34.79 38.18,22.3 38.18,7.32 16.56,19.81"/>
	<polygon fill="#f3b87b" points="9.07,15.48 16.56,19.81 38.18,7.32 30.69,3"/>
