	<polygon fill="#f3b87b" points="35.55,26.41 43.04,30.73 54.93,23.86 47.44,19.54"/>
	<polygon fill="#344126" points="9.07,56.68 16.56,61 16.56,46.02 9.07,41.7"/>
	<polygon fill="#bb6c5d" points="16.56,61 38.18,48.52 38.18,33.54 16.56,46.02"/>
