<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img">
	<title>Dose Coefficients</title>
	<!--
		The four letters of the ICRP's logotype, standing in a row: the
		commission whose models this page calculates with.

		The logotype is four heavy letters whose counters are cut down to
		hairline slits: a plain bar for the I, a C whose mouth is one slit from
		its right edge, and an R and a P each cut by a slit from the left, high
		up; a slit from below parts the R's leg from its stem, and the P is
		open under its bowl. Here the letters keep those widths and those cuts,
		measured on the logotype, and nothing else of it: no blue, no round
		bowls, and every cut as wide as a browser tab needs. It is redrawn,
		not copied.

		DRAWN IN THE KVOTAB MARK'S LANGUAGE, the same four rules as
		kompartment/icon.svg and smui-icon.svg: true 30-degree isometric
		(every edge horizontal, at +/-30 degrees or vertical, so the bowls are
		square); one flat tone per face, #f3b87b on top, #bb6c5d on the right,
		#344126 on the left; no strokes; no background plate.

		Each letter is its outline in one vertical plane, extruded towards the
		viewer, so the right faces spell the word and the tops are lit. A slit
		cut from the side shows its floor in the lit tone, as the logotype's
		slits are white; each gap between letters, and the R's slit from
		below, shows the shaded side of the letter behind it. The letters are
		narrowed to 62 per cent so that the word, rising at 30 degrees,
		fills the square, and every gap and slit is a pixel wide at sixteen
		pixels, which is what keeps the four letters apart in a browser tab.

		Generated by scripts/gen-dose-icon.py, not typed: the letters'
		measured widths and cuts, the narrowing, the depth and that one pixel,
		scaled into the square and rounded to two places. Change the inputs
		there and run it again rather than editing the numbers here.
	-->

	<!-- the P, farthest -->
	<polygon fill="#344126" points="51.96,23.32 51.96,39.26 42.67,33.89 42.67,17.95"/>
	<polygon fill="#344126" points="56.91,15.84 56.91,20.46 47.62,15.09 47.62,10.48"/>
	<polygon fill="#f3b87b" points="56.91,20.46 51.96,23.32 42.67,17.95 47.62,15.09"/>
	<polygon fill="#f3b87b" points="63.32,5.87 51.96,12.42 42.67,7.05 54.02,0.5"/>
	<polygon fill="#344126" points="51.96,12.42 51.96,18.7 42.67,13.33 42.67,7.05"/>
	<polygon fill="#bb6c5d" points="51.96,39.26 56.91,36.4 56.91,26.1 63.32,22.4 63.32,5.87 51.96,12.42 51.96,18.7 56.91,15.84 56.91,20.46 51.96,23.32"/>
	<!-- the R -->
	<polygon fill="#344126" points="45.12,35.62 45.12,43.21 35.83,37.84 35.83,30.25"/>
	<polygon fill="#344126" points="36.47,32.27 36.47,48.21 27.17,42.84 27.17,26.9"/>
	<polygon fill="#344126" points="41.29,24.86 41.29,29.48 32,24.11 32,19.49"/>
	<polygon fill="#f3b87b" points="41.29,29.48 36.47,32.27 27.17,26.9 32,24.11"/>
	<polygon fill="#f3b87b" points="47.96,14.73 36.47,21.37 27.17,16 38.67,9.36"/>
	<polygon fill="#344126" points="36.47,21.37 36.47,27.65 27.17,22.28 27.17,16"/>
	<polygon fill="#bb6c5d" points="36.47,48.21 41.12,45.52 41.12,37.92 45.12,35.62 45.12,43.21 47.96,41.57 47.96,14.73 36.47,21.37 36.47,27.65 41.29,24.86 41.29,29.48 36.47,32.27"/>
	<!-- the C -->
	<polygon fill="#f3b87b" points="32.47,39.01 25.78,42.86 16.49,37.5 23.17,33.64"/>
	<polygon fill="#344126" points="19.36,31.24 19.36,58.08 10.07,52.71 10.07,25.88"/>
	<polygon fill="#f3b87b" points="32.47,23.68 19.36,31.24 10.07,25.88 23.17,18.31"/>
	<polygon fill="#bb6c5d" points="19.36,58.08 32.47,50.52 32.47,39.01 25.78,42.86 25.78,38.24 32.47,34.39 32.47,23.68 19.36,31.24"/>
	<!-- the I, nearest -->
	<polygon fill="#344126" points="9.98,36.66 9.98,63.5 0.68,58.13 0.68,31.29"/>
	<polygon fill="#f3b87b" points="15.36,33.55 9.98,36.66 0.68,31.29 6.07,28.19"/>
	<polygon fill="#bb6c5d" points="9.98,63.5 15.36,60.39 15.36,33.55 9.98,36.66"/>
</svg>
